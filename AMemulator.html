<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music — Preview</title>
<script>
  // ---------- access gate ----------
  // This file has no server of its own to check identity against, so it trusts
  // a flag that index.html sets ONLY while the currently-signed-in Google account
  // is the real owner account (see syncEmulatorAccessFlag() in index.html), and
  // clears the instant that stops being true. Anyone who lands here without that
  // flag — i.e. anyone who didn't come from the admin panel's "Apple Music
  // emulator" button — gets bounced straight back to the main site.
  (function(){
    try{
      if(localStorage.getItem('emulator_access') !== 'true'){
        window.location.replace('index.html');
      }
    }catch(e){
      window.location.replace('index.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root{
    --font-apple: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
    --bg: #1f1f1f;
    --sidebar-bg: rgba(38,38,40,0.6);
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --text: rgba(255,255,255,0.92);
    --text-dim: rgba(255,255,255,0.74);
    --text-faint: rgba(255,255,255,0.5);
    --muted: rgba(255,255,255,0.6);
    --accent: #fa2d48;
    --accent-2: #ff5e78;
    --row-hover: rgba(255,255,255,0.06);
    --row-active: rgba(250,45,72,0.16);
    --shadow-soft: 0 18px 44px rgba(0,0,0,0.34);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: var(--font-apple);
    background: var(--bg);
    color: var(--text);
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button{ font-family: inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.14); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.24); }
  ::-webkit-scrollbar-track{ background:transparent; }

  #app{ display:flex; flex-direction:column; height:100%; }
  #main-row{ flex:1; display:flex; min-height:0; }

  /* ---------- sidebar ---------- */
  #sidebar{
    width: clamp(220px, 16.5vw, 232px);
    flex-shrink:0;
    background: var(--sidebar-bg);
    -webkit-backdrop-filter: saturate(2.2) blur(16px);
    backdrop-filter: saturate(2.2) blur(16px);
    border-right: 1px solid rgba(255,255,255,0.2);
    display:flex;
    flex-direction:column;
    padding: 0;
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.04);
  }
  .brand-row{
    display:flex; align-items:center; gap:9px;
    padding: 13px 12px 12px;
    margin-bottom: 0;
  }
  .brand-dot{
    width:auto; height:auto; border-radius:0;
    background: transparent;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    box-shadow: none;
    color: rgba(255,255,255,0.92);
    font-weight:500;
  }
  .brand-name{ font-weight:600; font-size:14px; letter-spacing:-0.1px; color: rgba(255,255,255,0.92); }
  .am-nav-list{ display:flex; flex-direction:column; gap:4px; }
  .am-primary-nav{ margin: 0 8px 8px; }
  .am-nav-btn{
    width:100%; display:flex; align-items:center; gap:10px; padding:10px 11px;
    border:none; border-radius:8px; background:transparent; color:var(--text-dim);
    cursor:pointer; font-size:13px; font-weight:500; text-align:left;
    transition: background .15s ease, color .15s ease, transform .12s ease;
    position: relative;
  }
  .am-nav-btn:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .am-nav-btn.active{
    background: rgba(255,255,255,0.14);
    color:#fff;
    box-shadow: none;
  }
  .am-nav-btn.active::before{
    content:'';
    display:none;
  }
  .am-nav-btn.active svg{ filter: none; }
  .am-nav-btn svg{ width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  .brand-row .brand-name{ margin-right:auto; }

  .sidebar-actions{ display:none; }
  .sidebar-action-btn{
    width:100%;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 8px 10px;
    font-size:12px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
  }
  .sidebar-action-btn:hover{ color:#fff; border-color: rgba(255,255,255,0.2); }

  .side-section-title{
    font-size: 11px; font-weight:500; text-transform:none; letter-spacing:0.1px;
    color: var(--text-faint);
    padding: 10px 11px 6px;
  }
  .side-section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 12px 6px;
  }
  .side-section-header .side-section-title{ padding: 0; }
  .side-edit-btn{
    border:none;
    background:transparent;
    color: var(--text-faint);
    font-size:11px;
    cursor:pointer;
    padding: 0;
  }
  .side-edit-btn:hover{ color:#fff; }
  .side-link-list{ display:flex; flex-direction:column; gap:1px; margin: 0 8px 8px; }
  .side-link-btn{
    width:100%; border:none; background:transparent; color: var(--text-dim);
    padding: 7px 10px; border-radius:7px; text-align:left; font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; gap:9px;
    transition: background .14s ease, color .14s ease;
  }
  .side-link-btn:hover{ color:#fff; background: rgba(255,255,255,0.06); }
  .side-link-btn svg{ width:14px; height:14px; fill:currentColor; flex-shrink:0; opacity:0.9; }
  .side-nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 7px 10px;
    border-radius:7px;
    font-size:13px;
    color: var(--text-dim);
    cursor:pointer;
    user-select:none;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .side-nav-item svg{ width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  .side-nav-item:hover{ background: var(--row-hover); color: var(--text); }
  .side-nav-item.active{
    background: rgba(255,255,255,0.14);
    color: #fff;
    box-shadow: none;
  }

  #song-list-nav{ flex:1; overflow-y:auto; margin: 4px 8px 0; min-height: 120px; }
  .side-song-item{
    display:flex; align-items:center; gap:9px;
    padding: 7px 11px;
    border-radius:8px;
    cursor:pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .side-song-item:hover{ background: var(--row-hover); }
  .side-song-item.playing{ background: var(--row-active); }
  .side-song-cover{
    width:30px; height:30px; border-radius:6px; object-fit:cover; flex-shrink:0;
    background: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .side-song-text{ min-width:0; }
  .side-song-title{
    font-size:12.5px; font-weight:700; color: var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    letter-spacing:-0.1px;
  }
  .side-song-item.playing .side-song-title{ color: var(--accent); }
  .side-song-artist{
    font-size:11px; color: var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .empty-side-note{ color: var(--text-faint); font-size:12px; padding: 10px 12px; line-height:1.5; }

  /* ---------- main / library view ---------- */
  #main{
    flex:1; min-width:0;
    overflow-y:auto;
    padding: 0;
    background: transparent;
    box-shadow: none;
  }
  #main h1{ font-size: 34px; font-weight:700; letter-spacing:0; margin: 0 0 2px; }
  #main .lib-sub{ color: var(--text-faint); font-size:12.5px; margin-bottom: 18px; }
  #library-body{ width:min(100%, 1080px); }
  #main-head{ padding: 22px clamp(18px, 3vw, 30px) 0; }
  #main-content{ padding: 0 clamp(18px, 3vw, 30px) 64px; }
  .home-intro{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.18;
    margin: 2px 0 16px;
    color: rgba(255,255,255,0.94);
  }
  .home-intro span{
    display:block;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.45;
    color: rgba(255,255,255,0.58);
    max-width: 560px;
    letter-spacing: 0;
  }
  .home-feature-grid{
    display:grid;
    grid-template-columns: minmax(0, 1.18fr) minmax(0, 1.18fr) minmax(0, 1.18fr);
    gap: 18px;
    margin-top: 8px;
  }
  .home-feature-card{
    position:relative;
    min-height: 210px;
    border-radius: 14px;
    overflow:hidden;
    cursor:pointer;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
  }
  .home-feature-card.large{ min-height: 420px; }
  .home-feature-media,
  .recent-card-media{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
  }
  .home-feature-media.fallback,
  .recent-card-media.fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--feature-color-a, #5a5a5a), var(--feature-color-b, #949494));
    color: rgba(255,255,255,0.45);
    font-size: 74px;
    font-weight: 700;
  }
  .home-feature-overlay,
  .recent-card-overlay{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.06) 0, rgba(0,0,0,0.18) 40%, rgba(0,0,0,0.72) 100%);
  }
  .home-feature-copy{
    position:absolute;
    inset:auto 14px 14px;
    z-index:1;
  }
  .home-feature-kicker{ font-size:11px; font-weight:700; color: rgba(255,255,255,0.72); margin-bottom:4px; }
  .home-feature-title{ font-size:16px; font-weight:800; line-height:1.15; color:#fff; }
  .home-feature-sub{ font-size:11.5px; color: rgba(255,255,255,0.76); margin-top:4px; line-height:1.3; }
  .home-feature-card.large .home-feature-title{ font-size: 28px; letter-spacing:-0.4px; }
  .home-feature-card.large .home-feature-sub{ font-size: 13px; max-width: 240px; }
  .home-feature-play{
    position:absolute;
    right:14px;
    bottom:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.14);
    color:#fff;
    z-index:1;
    font-size:13px;
    backdrop-filter: blur(8px);
  }
  .recent-strip{ margin-top: 28px; }
  .recent-strip-header{ display:flex; align-items:center; gap:8px; margin-bottom: 12px; }
  .recent-strip-title{ font-size:17px; font-weight:800; }
  .recent-strip-arrow{ color: rgba(255,255,255,0.45); font-size:18px; }
  .recent-grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }
  .recent-card{ cursor:pointer; min-width:0; }
  .recent-card-art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius: 12px;
    overflow:hidden;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
  }
  .recent-card-play{
    position:absolute;
    right:10px;
    bottom:10px;
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(17,17,18,0.7);
    color:#fff;
    font-size:12px;
    z-index:1;
  }
  .recent-card-title{ font-size:13px; font-weight:700; margin-top: 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recent-card-sub{ font-size:11px; color: rgba(255,255,255,0.54); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #desktop-rail{
    width: clamp(236px, 17.8vw, 256px);
    flex-shrink:0;
    border-left: 1px solid rgba(255,255,255,0.1);
    background: rgba(34,30,34,0.74);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .desktop-rail-panel{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .desktop-rail-panel::before{
    content:'';
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    pointer-events:none;
  }
  .desktop-rail-header{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 18px 16px 12px;
  }
  .desktop-rail-heading{ font-size:12px; font-weight:700; color: rgba(255,255,255,0.62); }
  .desktop-rail-tabs{ display:flex; gap:6px; }
  .desktop-rail-actions{ display:flex; align-items:center; gap:8px; }
  .desktop-rail-tab{
    border:none;
    background:transparent;
    color: rgba(255,255,255,0.46);
    font-size:11px;
    font-weight:700;
    padding: 5px 8px;
    border-radius:999px;
    cursor:pointer;
  }
  .desktop-rail-tab.active{ background: rgba(255,255,255,0.12); color:#fff; }
  .desktop-rail-expand{
    border:none;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.72);
    width:28px;
    height:28px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .desktop-rail-expand:hover{ color:#fff; background: rgba(255,255,255,0.14); }
  .desktop-rail-expand svg{ width:14px; height:14px; fill:currentColor; }
  .desktop-rail-body{
    position:relative;
    z-index:1;
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding: 0 16px 18px;
  }
  .desktop-rail-empty{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color: rgba(255,255,255,0.38);
    font-size:15px;
    text-align:center;
    line-height:1.45;
    padding: 0 20px;
  }
  .desktop-rail-track{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .desktop-rail-cover{
    width:52px;
    height:52px;
    border-radius:10px;
    object-fit:cover;
    background: rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .desktop-rail-track-title{ font-size:13px; font-weight:700; color:#fff; }
  .desktop-rail-track-artist{ font-size:11.5px; color: rgba(255,255,255,0.48); margin-top:2px; }
  .desktop-rail-body .np-lyric-section{ margin-top: 18px; margin-bottom: 8px; }
  .desktop-rail-body .np-lyric-line{
    font-size: 18px;
    line-height: 1.34;
    margin-bottom: 8px;
  }
  #desktop-lyrics-content{ padding-bottom: 30px; }
  .desktop-rail-queue-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor:pointer;
  }
  .desktop-rail-queue-row.current .desktop-rail-queue-title{ color: var(--accent); }
  .desktop-rail-queue-cover{ width:36px; height:36px; border-radius:8px; object-fit:cover; background: rgba(255,255,255,0.08); flex-shrink:0; }
  .desktop-rail-queue-title{ font-size:12px; font-weight:700; }
  .desktop-rail-queue-artist{ font-size:10.5px; color: rgba(255,255,255,0.44); margin-top:1px; }

  .am-hero{
    display:grid; grid-template-columns: 1.3fr 0.9fr; gap:18px;
    padding: 18px 20px; margin-bottom: 22px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    box-shadow: none;
  }
  .am-hero-copy h2{
    font-size: 27px; font-weight: 800; letter-spacing: -0.52px; margin-bottom: 6px;
    color: #fff;
  }
  .am-hero-copy p{
    color: var(--text-dim); font-size: 12.5px; line-height: 1.62; max-width: 540px;
  }
  .am-hero-stats{
    display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px;
  }
  .am-stat{
    padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow: none;
  }
  .am-stat-label{ font-size:11px; text-transform:uppercase; color: var(--text-faint); letter-spacing:0.4px; }
  .am-stat-value{ font-size:21px; font-weight: 700; margin-top:5px; }

  .am-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap:14px; }
  .am-section{ margin-top: 18px; }
  .am-section-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom: 10px;
  }
  .am-section-title{
    font-size: 17px; font-weight: 700; letter-spacing: -0.22px;
  }
  .am-section-link{
    border:none; background: rgba(255,255,255,0.05); color: var(--text-dim);
    border-radius: 999px; padding: 5px 10px; font-size: 10.5px; font-weight:700;
    cursor:pointer;
  }
  .am-card{
    position:relative; display:flex; flex-direction:column; gap:10px;
    padding: 10px; border-radius: 10px; cursor:pointer;
    background: rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.1); transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow: none;
    overflow:hidden;
  }
  .am-card::before{
    display:none;
  }
  .am-card:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); box-shadow: none; }
  .am-card.playing{ border-color: rgba(255,255,255,0.26); background: rgba(255,255,255,0.12); }
  .am-card-cover{
    width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; overflow:hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .am-card-title{ font-size:13px; font-weight:700; }
  .am-card-artist{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
  .am-card-meta{ display:flex; justify-content:space-between; align-items:center; color: var(--text-faint); font-size:11px; }
  .am-card-badge{ padding:2px 6px; border-radius:999px; background: rgba(255,255,255,0.06); }
  .shelf-section{ margin-top: 18px; }
  .shelf-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
  .shelf-card{
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color .14s ease, background .14s ease, transform .14s ease;
    min-height: 78px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }
  .shelf-card:hover{ border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); transform: translateY(-1px); }
  .shelf-title{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shelf-sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .shelf-meta{ font-size:10.5px; color: rgba(255,255,255,0.34); margin-top:8px; }
  .am-list-wrap{
    margin-top: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .songs-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top: 10px;
    padding: 8px 2px;
  }
  .songs-toolbar-left{ display:flex; align-items:center; gap:8px; }
  .songs-toolbar-right{ display:flex; align-items:center; gap:8px; }
  .songs-ctl-btn{
    border:1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    border-radius:999px;
    padding: 6px 11px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }
  .songs-ctl-btn:hover{ color:#fff; border-color: rgba(255,255,255,0.2); }
  .songs-select{
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    border-radius:9px;
    padding: 6px 8px;
    font-size:11px;
  }
  .songs-table-wrap{
    margin-top: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);

  .np-queue-row{ display:flex; align-items:center; gap:12px; padding:8px 8px; border-radius:10px; cursor:pointer; }

<script>
  const STORAGE_KEY = 'manuscript_lyric_drafts_v1';
  const safeLS = {
    get(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } },
  };

  let drafts = [];
  try{
    const raw = safeLS.get(STORAGE_KEY);
    drafts = raw ? JSON.parse(raw) : [];
  }catch(e){ drafts = []; }
  drafts = drafts.filter(d => !d.scrapped).sort((a,b) => (b.updated||0) - (a.updated||0));

  let currentIdx = drafts.length ? 0 : -1;
  let sessionAudio = { draftId: null, url: null, el: null };
  let npTab = 'lyrics';
  let syncPrevActiveIdx = null;
  let currentView = 'home';
  let searchQuery = '';
  let songsSort = 'recent';
  let favoriteMap = Object.create(null);
  let shuffleOn = false;
  let repeatMode = 'off';

  // ---------- helpers (mirror the main app's lyric/time helpers exactly, so
  // synced drafts render and highlight identically here) ----------
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function wordCount(text){
    const lyricOnly = (text||'').split('\n').filter(l => !/^\s*\[.+\]\s*$/.test(l)).join(' ');
    const t = lyricOnly.trim();
    return t ? t.split(/\s+/).filter(Boolean).length : 0;
  }
  function fmtTime(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + sec;
  }
  function normTime(t){
    if(t === undefined || t === null) return undefined;
    if(typeof t === 'number') return { start: t, end: t };
    return t;
  }
  function wordKey(lineIdx, wordIdx){ return lineIdx + ':' + wordIdx; }

  function lineHasWordSyncData(syncedWords, lineIdx){
    if(!syncedWords) return false;
    return Object.keys(syncedWords).some(key => key.split(':')[0] === String(lineIdx));
  }

  function buildLyricCopyMarkup(text, role){
    return text.split(/\s+/).map((word, wordIdx) =>
      '<span class="np-word" data-role="' + role + '" data-word-idx="' + wordIdx + '">' + escapeHtml(word) + '</span>'
    ).join('<span class="np-word-gap"> </span>');
  }

  function buildLyricsHtml(lyrics, syncedWords){
    const rawLines = (lyrics||'').split('\n');
    let html = '';
    let sectionOpen = false;
    rawLines.forEach((line, i) => {
      const trimmed = line.trim();
      const tagMatch = trimmed.match(/^\[(.+)\]$/);
      if(tagMatch){
        if(sectionOpen) html += '</div>';
        html += '<div class="np-lyric-section"><div class="np-section-tag">' + escapeHtml(tagMatch[1]) + '</div>';
        sectionOpen = true;
      } else if(trimmed === ''){
        html += '<div class="np-lyric-line blank"></div>';
      } else {
        if(!sectionOpen){ html += '<div class="np-lyric-section">'; sectionOpen = true; }
        const copyMarkup = buildLyricCopyMarkup(trimmed, 'base');
        const fillMarkup = buildLyricCopyMarkup(trimmed, 'fill');
        const lineClasses = 'np-lyric-line clickable' + (lineHasWordSyncData(syncedWords, i) ? ' has-word-sync' : '');
        html += '<div class="' + lineClasses + '" data-idx="' + i + '">' +
          '<span class="np-line-copy np-line-base">' + copyMarkup + '</span>' +
          '<span class="np-line-copy np-line-fill" aria-hidden="true">' + fillMarkup + '</span>' +
        '</div>';
      }
    });
    if(sectionOpen) html += '</div>';
    return html;
  }

  function getActive(){ return currentIdx >= 0 ? drafts[currentIdx] : null; }

  function getCurrentViewLabel(){
    if(currentView === 'search') return 'Search';
    if(currentView === 'home') return 'Home';
    if(currentView === 'radio') return 'Radio';
    if(currentView === 'songs') return 'Songs';
    if(currentView === 'artists') return 'Artists';
    if(currentView === 'albums') return 'Albums';
    if(currentView === 'videos') return 'Music Videos';
    return 'New';
  }

  function getDraftAlbumName(draft){
    return draft.album || ((draft.title || 'Untitled') + ' - Single');
  }

  function getArtPalette(index){
    const palettes = [
      ['#ff6a3d', '#f71e63'],
      ['#151515', '#454545'],
      ['#6d6d6d', '#adadad'],
      ['#22364a', '#4d6f8f']
    ];
    return palettes[index % palettes.length];
  }

  function renderBackgroundArt(className, draft, index){
    if(draft.cover){
      return '<div class="' + className + '" style="background-image:url(' + draft.cover + ')"></div>';
    }
    const palette = getArtPalette(index);
    return '<div class="' + className + ' fallback" style="--feature-color-a:' + palette[0] + ';--feature-color-b:' + palette[1] + '">♪</div>';
  }

      artists: '<svg viewBox="0 0 24 24"><path d="M12 12.75a3.375 3.375 0 1 0 0-6.75 3.375 3.375 0 0 0 0 6.75Zm-6.25 5A4.75 4.75 0 0 1 10.5 13h3a4.75 4.75 0 0 1 4.75 4.75.75.75 0 0 1-1.5 0A3.25 3.25 0 0 0 13.5 14.5h-3a3.25 3.25 0 0 0-3.25 3.25.75.75 0 0 1-1.5 0Z"/></svg>',
      albums: '<svg viewBox="0 0 24 24"><path d="M6 4.75A1.75 1.75 0 0 1 7.75 3h8.5A1.75 1.75 0 0 1 18 4.75v14.5A1.75 1.75 0 0 1 16.25 21h-8.5A1.75 1.75 0 0 1 6 19.25V4.75Zm2.75 1.75a.75.75 0 0 0-.75.75v9.5c0 .414.336.75.75.75h6.5a.75.75 0 0 0 .75-.75v-9.5a.75.75 0 0 0-.75-.75h-6.5Z"/></svg>',
      songs: '<svg viewBox="0 0 24 24"><path d="M15.5 4a.75.75 0 0 1 .75.75v9.19a2.75 2.75 0 1 1-1.5-2.44V7.07l-4.5 1.03v7.09A2.75 2.75 0 1 1 8.75 12.75V7.5a.75.75 0 0 1 .582-.73l6-1.375A.75.75 0 0 1 15.5 4Z"/></svg>',
      videos: '<svg viewBox="0 0 24 24"><path d="M5.75 5A1.75 1.75 0 0 0 4 6.75v10.5C4 18.216 4.784 19 5.75 19h7.5A1.75 1.75 0 0 0 15 17.25V14.9l4.61 2.42A.9.9 0 0 0 21 16.53V7.47a.9.9 0 0 0-1.39-.79L15 9.1V6.75A1.75 1.75 0 0 0 13.25 5h-7.5Z"/></svg>',
      home: '<svg viewBox="0 0 24 24"><path d="M5 10.6c0-.24.115-.465.31-.606l6.25-4.55a.75.75 0 0 1 .88 0l6.25 4.55c.195.141.31.366.31.606v7.65A1.75 1.75 0 0 1 17.25 20h-10.5A1.75 1.75 0 0 1 5 18.25V10.6Z"/></svg>'
    };
    return icons[view] || icons.new;
  }

  function buildArtistEntries(source){
    const artistMap = new Map();
    source.forEach((draft, idx) => {
      const artist = (draft.artist || 'Unknown Artist').trim() || 'Unknown Artist';
      const existing = artistMap.get(artist);
      if(existing){
        existing.count += 1;
        if((draft.updated || 0) > (existing.updated || 0)){
          existing.updated = draft.updated || 0;
          existing.cover = draft.cover || existing.cover;
          existing.playIdx = idx;
        }
      } else {
        artistMap.set(artist, { label: artist, count: 1, cover: draft.cover || '', updated: draft.updated || 0, playIdx: idx });
      }
    });
    return Array.from(artistMap.values()).sort((a,b) => a.label.localeCompare(b.label));
  }

  function buildAlbumEntries(source){
    const albumMap = new Map();
    source.forEach((draft, idx) => {
      const album = getDraftAlbumName(draft);
      const artist = draft.artist || 'Unknown Artist';
      const key = album + '::' + artist;
      const existing = albumMap.get(key);
      if(existing){
        existing.count += 1;
        if((draft.updated || 0) > (existing.updated || 0)){
          existing.updated = draft.updated || 0;
          existing.cover = draft.cover || existing.cover;
          existing.playIdx = idx;
        }
      } else {
        albumMap.set(key, { label: album, sublabel: artist, count: 1, cover: draft.cover || '', updated: draft.updated || 0, playIdx: idx });
      }
    });
    return Array.from(albumMap.values()).sort((a,b) => b.updated - a.updated || a.label.localeCompare(b.label));
  }

  function buildPlaylistEntries(source){
    if(!source.length) return [];
    const sortedRecent = [...source].sort((a,b) => (b.updated || 0) - (a.updated || 0));
    const sortedTitle = [...source].sort((a,b) => (a.title || '').localeCompare(b.title || ''));
    const synced = source.filter(d => Object.keys(d.syncedTimes || {}).length > 0);
    const wordSynced = source.filter(d => d.syncedWords && Object.keys(d.syncedWords).length > 0);
    const byArtist = buildArtistEntries(source);
    const playlists = [
      { label: 'Recently Added', sublabel: 'Latest drafts', count: sortedRecent.length, playIdx: drafts.indexOf(sortedRecent[0]) },
      { label: 'Singles', sublabel: 'All releases', count: source.length, playIdx: drafts.indexOf(sortedTitle[0]) }
    ];
    if(synced.length){
      playlists.push({ label: 'Synced Lyrics', sublabel: 'Timed lines ready', count: synced.length, playIdx: drafts.indexOf(synced[0]) });
    }
    if(wordSynced.length){
      playlists.push({ label: 'Word Sync', sublabel: 'Karaoke cuts', count: wordSynced.length, playIdx: drafts.indexOf(wordSynced[0]) });
    }
    if(byArtist.length){
      playlists.push({ label: byArtist[0].label + ' Essentials', sublabel: 'Artist spotlight', count: byArtist[0].count, playIdx: byArtist[0].playIdx });
    }
    return playlists.slice(0, 4);
  }

  function renderShelfCards(entries, attributeName, metaFormatter){
    return entries.map(entry =>
      '<div class="shelf-card" ' + attributeName + '="' + entry.playIdx + '">' +
        '<div class="shelf-title">' + escapeHtml(entry.label) + '</div>' +
        '<div class="shelf-sub">' + escapeHtml(entry.sublabel || '') + '</div>' +
        '<div class="shelf-meta">' + escapeHtml(metaFormatter(entry)) + '</div>' +
      '</div>'
    ).join('');
  }

  function wireLyricSeek(container){
    if(!container) return;
    const d = getActive();
    const loaded = !!(d && sessionAudio.draftId === d.id && sessionAudio.el);
    container.querySelectorAll('.np-lyric-line[data-idx]').forEach(el => {
      el.addEventListener('click', () => {
        if(!loaded) return;
        const t = normTime(d.syncedTimes && d.syncedTimes[el.dataset.idx]);
        if(t) sessionAudio.el.currentTime = t.start;
      });
    });
  }

  function renderDesktopRail(){
    const body = document.getElementById('desktop-rail-body');
    const lyricsTab = document.getElementById('desktop-tab-lyrics');
    const queueTab = document.getElementById('desktop-tab-queue');
    if(!body || !lyricsTab || !queueTab) return;
    lyricsTab.classList.toggle('active', npTab === 'lyrics');
    queueTab.classList.toggle('active', npTab === 'queue');
    const active = getActive();
    if(!active){
      body.innerHTML = '<div class="desktop-rail-empty">Play a song to see lyrics here.</div>';
      return;
    }
    const cover = active.cover ? '<img class="desktop-rail-cover" src="' + active.cover + '" alt="">' : '<div class="desktop-rail-cover"></div>';
    const trackHeader = '<div class="desktop-rail-track">' +
      cover +
      '<div><div class="desktop-rail-track-title">' + escapeHtml(active.title || 'Untitled') + '</div><div class="desktop-rail-track-artist">' + escapeHtml(active.artist || 'Unknown Artist') + '</div></div>' +
    '</div>';
    if(npTab === 'queue'){
      body.innerHTML = trackHeader + drafts.map((draft, idx) =>
        '<div class="desktop-rail-queue-row' + (idx === currentIdx ? ' current' : '') + '" data-rail-idx="' + idx + '">' +
          (draft.cover ? '<img class="desktop-rail-queue-cover" src="' + draft.cover + '" alt="">' : '<div class="desktop-rail-queue-cover"></div>') +
          '<div><div class="desktop-rail-queue-title">' + escapeHtml(draft.title || 'Untitled') + '</div><div class="desktop-rail-queue-artist">' + escapeHtml(draft.artist || 'Unknown Artist') + '</div></div>' +
        '</div>'
      ).join('');
      body.querySelectorAll('[data-rail-idx]').forEach(el => el.addEventListener('click', () => playTrack(Number(el.dataset.railIdx))));
      return;
    }
    if(active.lyrics && active.lyrics.trim()){
      body.innerHTML = trackHeader + '<div id="desktop-lyrics-content">' + buildLyricsHtml(active.lyrics, active.syncedWords) + '</div>';
      wireLyricSeek(body);
      if(sessionAudio.el) updateSyncHighlight();
    } else {
      body.innerHTML = trackHeader + '<div class="desktop-rail-empty">Play a song to see lyrics here.</div>';
    }
  }

  function setView(view){
    currentView = view;
    const navId = view === 'search' ? 'nav-search' : (view === 'home' ? 'nav-listen' : (view === 'radio' ? 'nav-radio' : 'nav-library'));
    setActiveNav(navId);
    renderSongLists();
    const main = document.getElementById('main');
    if(main) main.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- sidebar + library rendering ----------
  function renderSongLists(){
    const q = currentView === 'search' ? (searchQuery || '').trim().toLowerCase() : '';
    const filtered = q
      ? drafts.filter(d => (d.title||'').toLowerCase().includes(q) || (d.artist||'').toLowerCase().includes(q))
      : drafts;

    const titleEl = document.querySelector('#main h1');
    if(titleEl) titleEl.textContent = getCurrentViewLabel();

    const libList = document.getElementById('library-list-nav');
    if(libList){
      const itemWithIcon = (label, view) =>
        '<button class="side-link-btn" data-view="' + view + '">' +
          getLibraryIcon(view) +
          label +
        '</button>';
      libList.innerHTML =
        itemWithIcon('Recently Added', 'new') +
        itemWithIcon('Artists', 'artists') +
        itemWithIcon('Albums', 'albums') +
        itemWithIcon('Songs', 'songs') +
        itemWithIcon('Music Videos', 'videos') +
        itemWithIcon('Made for You', 'home');
      libList.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.dataset.view));
      });
    }

    const playlistList = document.getElementById('playlist-list-nav');
    const storeList = document.getElementById('store-list-nav');
    if(storeList){
      storeList.innerHTML = '<button class="side-link-btn" id="sidebar-itunes-store" type="button">' +
        '<svg viewBox="0 0 24 24"><path d="M7.75 4A1.75 1.75 0 0 0 6 5.75v12.5C6 19.216 6.784 20 7.75 20h8.5A1.75 1.75 0 0 0 18 18.25V5.75A1.75 1.75 0 0 0 16.25 4h-8.5Zm3.5 2.5a.75.75 0 0 1 .75.75v4.94a2.25 2.25 0 1 1-1.5-2.11V8.24a.75.75 0 0 1 .582-.73l2.5-.57a.75.75 0 0 1 .918.73v3.02a2.25 2.25 0 1 1-1.5-2.11V8.62l-1 .23V6.5Z"/></svg>' +
        'iTunes Store</button>';
      const storeBtn = document.getElementById('sidebar-itunes-store');
      if(storeBtn){
        storeBtn.addEventListener('click', () => window.open('https://music.apple.com/', '_blank'));
      }
    }
    if(playlistList){
      const playlistEntries = buildPlaylistEntries(drafts);
      const staticPlaylists = [
        { label: 'All Playlists', playIdx: drafts[0] ? drafts.indexOf(drafts[0]) : -1, icon: '<svg viewBox="0 0 24 24"><path d="M4 6.75A.75.75 0 0 1 4.75 6h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 4 6.75Zm0 5.25A.75.75 0 0 1 4.75 11h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 4 12Zm0 5.25a.75.75 0 0 1 .75-.75h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1-.75-.75ZM12 6.75a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 12 6.75Zm0 5.25a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5A.75.75 0 0 1 12 12Zm0 5.25a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75Z"/></svg>' },
        { label: 'Favourite Songs', playIdx: drafts[0] ? drafts.indexOf(drafts[0]) : -1, icon: '<svg viewBox="0 0 24 24"><path d="M12.1 20.3 4.9 13.1a4.9 4.9 0 0 1 6.9-6.9l.2.2.2-.2a4.9 4.9 0 0 1 6.9 6.9l-7.2 7.2a.6.6 0 0 1-.8 0Z"/></svg>' }
      ];
      playlistList.innerHTML = drafts.length
        ? staticPlaylists.concat(playlistEntries.map(entry => ({ label: entry.label, playIdx: entry.playIdx, icon: '<svg viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg>' }))).map(entry => '<button class="side-link-btn" data-play-idx="' + entry.playIdx + '">' + entry.icon + escapeHtml(entry.label) + '</button>').join('')
        : '<div class="empty-side-note">No playlists yet.</div>';
      playlistList.querySelectorAll('[data-play-idx]').forEach(btn => {
        btn.addEventListener('click', () => playTrack(Number(btn.dataset.playIdx)));
      });
    }

    const nav = document.getElementById('song-list-nav');
    if(!drafts.length){
      nav.innerHTML = '<div class="empty-side-note">No drafts yet. Head back to the studio and write one — it\'ll show up here as a track.</div>';
    } else if(!filtered.length){
      nav.innerHTML = '<div class="empty-side-note">No matches.</div>';
    } else {
      nav.innerHTML = filtered.map(d => {
        const idx = drafts.indexOf(d);
        return '<div class="side-song-item' + (idx===currentIdx ? ' playing' : '') + '" data-idx="' + idx + '">' +
          (d.cover ? '<img class="side-song-cover" src="' + d.cover + '">' : '<div class="side-song-cover"></div>') +
          '<div class="side-song-text">' +
            '<div class="side-song-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
            '<div class="side-song-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      nav.querySelectorAll('.side-song-item').forEach(el => {
        el.addEventListener('click', () => playTrack(Number(el.dataset.idx)));
      });
    }

    const libSub = document.getElementById('lib-sub');
    if(libSub){
      if(currentView === 'home') libSub.textContent = 'Made for you';
      else if(currentView === 'new') libSub.textContent = drafts.length ? (drafts.length + (drafts.length===1 ? ' new release' : ' new releases')) : '';
      else if(currentView === 'radio') libSub.textContent = 'Live and upcoming shows';
      else if(currentView === 'search') libSub.textContent = 'Discover by artist, song, or lyric';
      else libSub.textContent = drafts.length ? (drafts.length + (drafts.length===1 ? ' song' : ' songs')) : '';
    }

    const body = document.getElementById('library-body');

    if(currentView === 'songs'){
      const songs = [...filtered];
      if(songsSort === 'title') songs.sort((a,b) => (a.title||'').localeCompare(b.title||''));
      if(songsSort === 'artist') songs.sort((a,b) => (a.artist||'').localeCompare(b.artist||''));
      if(songsSort === 'recent') songs.sort((a,b) => (b.updated||0) - (a.updated||0));
      body.innerHTML =
        '<div class="songs-toolbar">' +
          '<div class="songs-toolbar-left">' +
            '<button class="songs-ctl-btn" id="songs-play-all" type="button">Play</button>' +
            '<button class="songs-ctl-btn" id="songs-shuffle" type="button">Shuffle</button>' +
          '</div>' +
          '<div class="songs-toolbar-right">' +
            '<span style="font-size:11px; color: var(--text-faint);">Sort</span>' +
            '<select class="songs-select" id="songs-sort">' +
              '<option value="recent">Recently Added</option>' +
              '<option value="title">Title</option>' +
              '<option value="artist">Artist</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="songs-table-wrap">' +
          '<table class="songs-table">' +
            '<thead><tr><th class="songs-fav-col">Favorited</th><th>Name</th><th>Artist</th><th>Album</th><th class="songs-time-col">Time</th></tr></thead>' +
            '<tbody>' + songs.map((d, i) => {
              const idx = drafts.indexOf(d);
              const loaded = sessionAudio.draftId === d.id;
              const dur = loaded && sessionAudio.el && sessionAudio.el.duration ? fmtTime(sessionAudio.el.duration) : '--:--';
              const fav = !!favoriteMap[d.id || idx];
              const album = d.album || ((d.title || 'Untitled') + ' - Single');
              return '<tr' + (idx===currentIdx ? ' class="playing"' : '') + ' data-idx="' + idx + '">' +
                '<td>' +
                  '<button class="row-action-btn' + (fav ? ' active' : '') + '" data-fav="' + idx + '" title="Favourite">' +
                    '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12.1 20.3 4.9 13.1a4.9 4.9 0 0 1 6.9-6.9l.2.2.2-.2a4.9 4.9 0 0 1 6.9 6.9l-7.2 7.2a.6.6 0 0 1-.8 0Z"/></svg>' +
                  '</button>' +
                '</td>' +
                '<td>' +
                  '<div class="song-name-cell">' +
                    '<div class="row-cover-wrap">' +
                      (d.cover ? '<img class="row-cover" src="' + d.cover + '">' : '<div class="row-cover"></div>') +
                      '<div class="row-hover-play"><svg viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg></div>' +
                      '<div class="row-eq"><span></span><span></span><span></span></div>' +
                    '</div>' +
                    '<span>' + escapeHtml(d.title || 'Untitled') + '</span>' +
                    '<button class="song-name-play" data-play-row="' + idx + '" title="Play"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M8,5V19L19,12Z"/></svg></button>' +
                  '</div>' +
                '</td>' +
                '<td>' + escapeHtml(d.artist || 'Unknown Artist') + '</td>' +
                '<td>' + escapeHtml(album) + '</td>' +
                '<td class="songs-time-col">' + dur + '</td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table>' +
        '</div>';
      const sortEl = document.getElementById('songs-sort');
      if(sortEl){
        sortEl.value = songsSort;
        sortEl.addEventListener('change', (e) => {
          songsSort = e.target.value;
          renderSongLists();
        });
      }
      const playAllBtn = document.getElementById('songs-play-all');
      if(playAllBtn){
        playAllBtn.addEventListener('click', () => { if(songs.length) playTrack(drafts.indexOf(songs[0])); });
      }
      const shuffleBtn = document.getElementById('songs-shuffle');
      if(shuffleBtn){
        shuffleBtn.addEventListener('click', () => {
          if(!songs.length) return;
          const random = songs[Math.floor(Math.random() * songs.length)];
          playTrack(drafts.indexOf(random));
        });
      }
      body.querySelectorAll('tr[data-idx]').forEach(row => {
        row.addEventListener('click', () => playTrack(Number(row.dataset.idx)));
      });
      body.querySelectorAll('[data-play-row]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTrack(Number(btn.dataset.playRow));
        });
      });
      body.querySelectorAll('[data-fav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.fav);
          const d = drafts[idx];
          const key = d.id || idx;
          favoriteMap[key] = !favoriteMap[key];
          renderSongLists();
        });
      });

  // ---------- playback ----------
  function playTrack(idx){
    if(idx < 0 || idx >= drafts.length) return;
    currentIdx = idx;
    const d = drafts[currentIdx];

    const mp = document.getElementById('mini-player');
    if(!mp.classList.contains('visible')){
      mp.classList.add('visible');
      void mp.offsetHeight; // force reflow so has-track's transform actually transitions in
      requestAnimationFrame(() => mp.classList.add('has-track'));
    }
    const miniCover = document.getElementById('mini-cover');
    miniCover.style.opacity = '0';
    setTimeout(() => {
      miniCover.src = d.cover || '';
      miniCover.style.visibility = d.cover ? 'visible' : 'hidden';
      miniCover.style.opacity = '1';
    }, 140);
    document.getElementById('mini-title').textContent = d.title || 'Untitled';
    document.getElementById('mini-artist').textContent = d.artist || 'Unknown Artist';

    if(sessionAudio.el){
      sessionAudio.el.pause();
      if(sessionAudio.url) URL.revokeObjectURL(sessionAudio.url);
    }
    sessionAudio = { draftId: null, url: null, el: null };

    renderSongLists();
    renderNowPlayingInfo();
    renderLyrics();
    refreshTransportUI();
    renderDesktopRail();
  }

  function renderNowPlayingInfo(){
    const d = getActive();
    if(!d) return;
    const titleEl = document.getElementById('np-title');
    const artistEl = document.getElementById('np-artist');
    const cover = document.getElementById('np-cover');
    const placeholder = document.getElementById('np-cover-placeholder');
    const backdrop = document.getElementById('np-backdrop');

    // fade the outgoing art/text out, swap content, fade back in — avoids the
    // jarring instant pop when skipping tracks
    [titleEl, artistEl, cover, placeholder, backdrop].forEach(el => el.style.opacity = '0');
    setTimeout(() => {
      titleEl.textContent = d.title || 'Untitled';
      artistEl.textContent = d.artist || 'Unknown Artist';
      if(d.cover){
        cover.src = d.cover; cover.style.display = 'block'; placeholder.style.display = 'none';
        backdrop.style.backgroundImage = 'url(' + d.cover + ')'; backdrop.classList.add('has-cover');
      } else {
        cover.style.display = 'none'; placeholder.style.display = 'flex';
        backdrop.classList.remove('has-cover');
      }
      requestAnimationFrame(() => {
        titleEl.style.opacity = '1'; artistEl.style.opacity = '1';
        cover.style.opacity = '1'; placeholder.style.opacity = '1';
        backdrop.style.opacity = backdrop.classList.contains('has-cover') ? '0.9' : '0';
      });
    }, 160);
    renderQueuePanel();
    renderDesktopRail();
  }

  function renderQueuePanel(){
    const panel = document.getElementById('np-queue-panel');
    const active = getActive();
    const toolbar =
      '<div class="np-queue-toolbar">' +
        '<button class="np-queue-mode-btn active" id="np-queue-autoplay" type="button"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8Zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3Z"/></svg>AutoPlay</button>' +
        '<button class="np-queue-mode-btn" id="np-queue-automix" type="button"><svg viewBox="0 0 24 24"><path d="M14 6.5l4-2.5v16l-4-2.5M6 4h5v16H6zM3 9h1v6H3z"/></svg>AutoMix</button>' +
      '</div>' +
      '<div class="np-queue-section-header">' +
        '<div class="np-queue-section-title">Continue Playing</div>' +
        '<button class="np-queue-clear-btn" id="np-queue-clear" type="button">Clear</button>' +
      '</div>' +
      '<div class="np-queue-section-sub">' + (active ? 'From ' + escapeHtml(active.album || ((active.title || 'Untitled') + ' - Single')) : '') + '</div>';
    if(!drafts.length){ panel.innerHTML = toolbar + '<div id="np-no-lyrics">There\u2019s no music in the queue.</div>'; return; }
    panel.innerHTML = toolbar + drafts.map((d, i) => {
      return '<div class="np-queue-row' + (i===currentIdx ? ' current' : '') + '" data-idx="' + i + '">' +
        (d.cover ? '<img class="np-queue-cover" src="' + d.cover + '">' : '<div class="np-queue-cover"></div>') +
        '<div><div class="np-queue-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
        '<div class="np-queue-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div></div>' +
        '<span class="np-queue-more">\u22EF</span>' +
      '</div>';
    }).join('');
    panel.querySelectorAll('.np-queue-row').forEach(el => {
      el.addEventListener('click', () => playTrack(Number(el.dataset.idx)));
    });
    const autoplayBtn = document.getElementById('np-queue-autoplay');
    const automixBtn = document.getElementById('np-queue-automix');
    if(autoplayBtn && automixBtn){
      autoplayBtn.addEventListener('click', (e) => { e.stopPropagation(); autoplayBtn.classList.add('active'); automixBtn.classList.remove('active'); });
      automixBtn.addEventListener('click', (e) => { e.stopPropagation(); automixBtn.classList.add('active'); autoplayBtn.classList.remove('active'); });

  function renderLyrics(){
    const d = getActive();
    const content = document.getElementById('np-lyrics-content');
    const banner = document.getElementById('load-audio-banner');
    if(!d){ content.innerHTML = ''; banner.classList.remove('show'); return; }
    const lyrics = d.lyrics || '';
    const hasSyncData = d.syncedTimes && Object.keys(d.syncedTimes).length > 0;
    const loaded = sessionAudio.draftId === d.id;

    banner.classList.toggle('show', !loaded);
    document.getElementById('load-audio-text').textContent = hasSyncData
      ? "This track has synced lyrics — load its audio to hear it play back karaoke-style."
      : "Load this track's audio to enable playback.";

    if(!lyrics.trim()){
      content.innerHTML = '<div id="np-no-lyrics">No lyrics written for this draft yet.</div>';
      return;
    }
    content.innerHTML = buildLyricsHtml(lyrics, d.syncedWords);
    content.querySelectorAll('.np-lyric-line[data-idx]').forEach(el => {
      el.addEventListener('click', () => {
        if(!loaded || !sessionAudio.el) return;
        const t = normTime(d.syncedTimes && d.syncedTimes[el.dataset.idx]);
        if(t) sessionAudio.el.currentTime = t.start;
      });
    });
    syncPrevActiveIdx = null;
    updateLayoutMode();
    renderDesktopRail();
  }

  // ---------- session audio loading (per-track, not persisted — mirrors the
  // main app's design where raw audio blobs never touch localStorage) ----------
  function loadAudioForCurrent(file){
    const d = getActive();
    if(!d || !file) return;
    if(sessionAudio.url) URL.revokeObjectURL(sessionAudio.url);
    const url = URL.createObjectURL(file);
    const el = new Audio(url);
    el.preload = 'metadata';
    sessionAudio = { draftId: d.id, url, el };
    wireAudioElement(el);
    el.addEventListener('loadedmetadata', () => { renderSongLists(); refreshTransportUI(); });
    document.getElementById('load-audio-banner').classList.remove('show');
  }

  function wireAudioElement(el){
    el.volume = Number(document.getElementById('mini-volume').value || 0.9);
    el.addEventListener('play', () => { refreshTransportUI(); startSmoothLoop(); });
    el.addEventListener('pause', () => { refreshTransportUI(); updateSyncHighlight(); stopSmoothLoop(); });
    el.addEventListener('seeked', () => { refreshTransportUI(); updateSyncHighlight(); });
    el.addEventListener('ended', () => { stopSmoothLoop(); nextTrack(true); });
  }

  // Karaoke-style word/line highlighting needs to sweep continuously, not in the
  // ~4-times-a-second steps that the audio element's 'timeupdate' event fires at
  // — that stepping is what made the sync look choppy instead of smooth like
  // Apple Music's actual lyrics view. Runs every animation frame only while a
  // track is actually playing, and stops itself the instant it's paused.
  let smoothLoopHandle = null;
  function startSmoothLoop(){
    if(smoothLoopHandle) return;
    const tick = () => {
      const el = sessionAudio.el;
      if(!el || el.paused){ smoothLoopHandle = null; return; }
      refreshTransportUI();
      updateSyncHighlight();
      smoothLoopHandle = requestAnimationFrame(tick);
    };
    smoothLoopHandle = requestAnimationFrame(tick);
  }
  function stopSmoothLoop(){
    if(smoothLoopHandle){ cancelAnimationFrame(smoothLoopHandle); smoothLoopHandle = null; }
  }

  document.getElementById('load-audio-btn').addEventListener('click', () => {
    document.getElementById('load-audio-input').click();
  });
  document.getElementById('load-audio-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) loadAudioForCurrent(file);
    e.target.value = '';
  });

  // ---------- transport UI (mini bar + fullscreen bar share the same audio state) ----------
  function refreshTransportUI(){
    const el = sessionAudio.el;
    const pct = (el && el.duration) ? (el.currentTime/el.duration)*100 : 0;
    const elapsed = el ? fmtTime(el.currentTime) : '0:00';
    const remaining = el ? '-' + fmtTime((el.duration||0) - el.currentTime) : '-0:00';
    const playing = el && !el.paused;
    const playIcon = playing
      ? '<path d="M6,5H10V19H6ZM14,5H18V19H14Z"/>'
      : '<path d="M8,5V19L19,12Z"/>';

    document.getElementById('mini-scrub-fill').style.width = pct + '%';
    document.getElementById('mini-scrub-dot').style.left = pct + '%';
    document.getElementById('mini-time-elapsed').textContent = elapsed;
    document.getElementById('mini-time-remaining').textContent = remaining;
    document.getElementById('mini-play-icon').innerHTML = playIcon;

    document.getElementById('np-scrub-fill').style.width = pct + '%';
    document.getElementById('np-scrub-dot').style.left = pct + '%';
    document.getElementById('np-time-elapsed').textContent = elapsed;
    document.getElementById('np-time-remaining').textContent = remaining;
    document.getElementById('np-play-icon').innerHTML = playIcon;

    const playingRow = document.querySelector('table.song-table tr.playing');
    if(playingRow) playingRow.classList.toggle('row-paused', !playing);
  }

  function togglePlay(){
    const el = sessionAudio.el;
    if(!el) return;
    if(el.paused) el.play(); else el.pause();
  }
  function restart(){
    const el = sessionAudio.el;
    if(!el) return;
    el.currentTime = 0;
    el.play();
  }
  function seekForward(){
    const el = sessionAudio.el;
    if(!el) return;
    el.currentTime = Math.min(el.duration || Infinity, el.currentTime + 10);
    refreshTransportUI();
  }
  function nextTrack(auto){
    if(!drafts.length) return;
    if(repeatMode === 'one' && currentIdx >= 0 && sessionAudio.el){
      sessionAudio.el.currentTime = 0;
      sessionAudio.el.play();
      return;
    }
    let next = currentIdx + 1;
    if(shuffleOn && drafts.length > 1){
      do {
        next = Math.floor(Math.random() * drafts.length);
      } while(next === currentIdx);
    } else if(next >= drafts.length) {
      if(repeatMode === 'all' || auto) next = 0;
      else next = drafts.length - 1;
    }
    playTrack(next);
    if(auto){ /* auto-advance leaves playback paused since new track has no audio loaded yet */ }
  }
  function prevTrack(){
    if(!drafts.length) return;
    const prev = (currentIdx - 1 + drafts.length) % drafts.length;
    playTrack(prev);
  }

  function seekFromTrack(track, clientX){
    const el = sessionAudio.el;
    if(!el || !el.duration) return;
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    el.currentTime = frac * el.duration;
    refreshTransportUI();
  }
  function wireScrubTrack(trackEl){
    let scrubbing = false;
    trackEl.addEventListener('pointerdown', e => { scrubbing = true; trackEl.setPointerCapture(e.pointerId); seekFromTrack(trackEl, e.clientX); });
    trackEl.addEventListener('pointermove', e => { if(scrubbing) seekFromTrack(trackEl, e.clientX); });
    trackEl.addEventListener('pointerup', () => { scrubbing = false; });
  }

  function setVolume(value, sourceId){
    const normalized = Math.max(0, Math.min(1, Number(value)));
    ['mini-volume', 'np-volume'].forEach(id => {
      if(id !== sourceId){
        const input = document.getElementById(id);
        if(input) input.value = String(normalized);
      }
    });
    if(sessionAudio.el) sessionAudio.el.volume = normalized;
  }

  wireScrubTrack(document.getElementById('mini-scrub-track'));
  wireScrubTrack(document.getElementById('np-scrub-track'));

  document.getElementById('mini-play').addEventListener('click', togglePlay);
  document.getElementById('np-play').addEventListener('click', togglePlay);
  document.getElementById('np-prev').addEventListener('click', prevTrack);
  document.getElementById('np-next').addEventListener('click', () => nextTrack(false));
  document.getElementById('mini-next').addEventListener('click', () => nextTrack(false));
  document.getElementById('mini-prev').addEventListener('click', prevTrack);
  document.getElementById('mini-volume').addEventListener('input', (e) => setVolume(e.target.value, 'mini-volume'));
  document.getElementById('np-volume').addEventListener('input', (e) => setVolume(e.target.value, 'np-volume'));

  // ---------- karaoke highlight (line + word), same behavior as the main app ----------
  function resetLyricLineState(lineEl){
    if(!lineEl) return;
    lineEl.classList.remove('active-sync', 'line-sync-active', 'word-sync-active', 'was-sung', 'is-near', 'is-mid');
    lineEl.style.removeProperty('--line-progress');
    lineEl.querySelectorAll('.np-line-fill .np-word').forEach(wordEl => {
      wordEl.style.removeProperty('--word-progress');
      wordEl.classList.remove('active-word', 'sung-word');
    });
  }

  function keepLyricInView(panel, activeEl, topPct, bottomPct, targetPct){
    if(!panel || !activeEl) return;
    const panelRect = panel.getBoundingClientRect();
    const lineRect = activeEl.getBoundingClientRect();
    const lineCenter = lineRect.top + (lineRect.height / 2);
    const topBound = panelRect.top + (panelRect.height * topPct);
    const bottomBound = panelRect.top + (panelRect.height * bottomPct);
    if(lineCenter >= topBound && lineCenter <= bottomBound) return;
    const targetCenter = panelRect.top + (panelRect.height * targetPct);
    const delta = lineCenter - targetCenter;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    panel.scrollTo({
      top: panel.scrollTop + delta,
      behavior: prefersReducedMotion ? 'auto' : 'smooth'
    });
  }

  function keepActiveLyricInView(activeEl){
    keepLyricInView(document.getElementById('np-lyrics-panel'), activeEl, 0.34, 0.68, 0.54);
  }

  function updateLyricDepthClasses(activeEl, lyricLines){
    if(!activeEl) return;
    const activeRect = activeEl.getBoundingClientRect();
    const activeCenter = activeRect.top + (activeRect.height / 2);
    const activePos = lyricLines.findIndex(lineEl => lineEl === activeEl);
    lyricLines.forEach((lineEl, linePos) => {
      lineEl.classList.remove('active-sync', 'was-sung', 'is-near', 'is-mid');
      const lineRect = lineEl.getBoundingClientRect();
      const lineCenter = lineRect.top + (lineRect.height / 2);
      const distance = Math.abs(lineCenter - activeCenter);
      if(linePos === activePos){
        lineEl.classList.add('active-sync');
        return;
      }
      if(linePos < activePos) lineEl.classList.add('was-sung');
      if(distance <= 88) lineEl.classList.add('is-near');
      else if(distance <= 176) lineEl.classList.add('is-mid');
    });
  }

  function updateSyncHighlight(){
    const d = getActive();
    if(!d || !d.syncedTimes || !sessionAudio.el) return;
    const t = sessionAudio.el.currentTime;
    const entries = Object.entries(d.syncedTimes)
      .map(([idx,time]) => ({ idx, time: normTime(time) }))
      .sort((a,b) => a.time.start - b.time.start);
    let activeIdx = null;
    entries.forEach(e => { if(e.time.start <= t) activeIdx = e.idx; });

    const containers = [
      { content: '#np-lyrics-content', panel: document.getElementById('np-lyrics-panel'), bounds: [0.34, 0.68, 0.54] },
      { content: '#desktop-lyrics-content', panel: document.getElementById('desktop-rail-body'), bounds: [0.24, 0.76, 0.5] }
    ];

    containers.forEach(({ content, panel, bounds }) => {
      const lyricLines = Array.from(document.querySelectorAll(content + ' .np-lyric-line[data-idx]'));
      if(!lyricLines.length) return;
      const activeEl = activeIdx !== null
        ? document.querySelector(content + ' .np-lyric-line[data-idx="' + activeIdx + '"]')
        : null;
      if(activeIdx !== syncPrevActiveIdx){
        lyricLines.forEach(resetLyricLineState);
        if(activeEl) keepLyricInView(panel, activeEl, bounds[0], bounds[1], bounds[2]);
      }
      if(activeEl) updateLyricDepthClasses(activeEl, lyricLines);
      else lyricLines.forEach(lineEl => lineEl.classList.remove('active-sync', 'was-sung', 'is-near', 'is-mid'));

      lyricLines.forEach(lineEl => {
        if(lineEl.dataset.idx !== String(activeIdx)){
          lineEl.classList.remove('line-sync-active', 'word-sync-active');
          lineEl.style.removeProperty('--line-progress');
          lineEl.querySelectorAll('.np-line-fill .np-word').forEach(wordEl => {
            wordEl.style.setProperty('--word-progress', '0%');
            wordEl.classList.remove('active-word', 'sung-word');
          });
        }
      });

      if(activeIdx === null) return;
      const lineHasWordSync = lineHasWordSyncData(d.syncedWords, activeIdx);
      if(lineHasWordSync){
        const lineEl = document.querySelector(content + ' .np-lyric-line[data-idx="' + activeIdx + '"]');
        if(!lineEl) return;
        lineEl.classList.add('word-sync-active');
        lineEl.classList.remove('line-sync-active');
        lineEl.querySelectorAll('.np-line-fill .np-word').forEach(wEl => {
          const key = wordKey(activeIdx, wEl.dataset.wordIdx);
          const wt = normTime(d.syncedWords && d.syncedWords[key]);
          let progress = 0;
          if(wt){
            if(t >= wt.end) progress = 100;
            else if(t > wt.start && wt.end > wt.start) progress = ((t - wt.start) / (wt.end - wt.start)) * 100;
          }
          progress = Math.max(0, Math.min(100, progress));
          wEl.style.setProperty('--word-progress', progress + '%');
          wEl.classList.toggle('active-word', !!wt && t >= wt.start && t < wt.end);
          wEl.classList.toggle('sung-word', !!wt && t >= wt.end);
        });
      } else {
        const lineEl = document.querySelector(content + ' .np-lyric-line[data-idx="' + activeIdx + '"]');
        if(lineEl){
          lineEl.classList.add('line-sync-active');
          lineEl.classList.remove('word-sync-active');
          const curPos = entries.findIndex(e => e.idx === activeIdx);
          const lineStart = entries[curPos].time.start;
          const nextEntry = entries[curPos + 1];
          const lineEnd = nextEntry ? nextEntry.time.start : (sessionAudio.el.duration || lineStart + 4);
          const progress = lineEnd > lineStart ? Math.min(1, Math.max(0, (t - lineStart) / (lineEnd - lineStart))) : 1;
          lineEl.style.setProperty('--line-progress', (progress * 100) + '%');
        }
      }
    });
    syncPrevActiveIdx = activeIdx;
  }

  // ---------- fullscreen now-playing open/close + tabs ----------
  // display:none can't be transitioned, so opening needs two steps: make it
  // display:flex (still visually at its closed transform/opacity), force a
  // reflow, then add the class that animates it to open — otherwise the browser
  // collapses the "closed → open" change into a single frame and nothing slides.
  function openFullscreen(){
    if(!getActive()) return;
    const el = document.getElementById('fullscreen-np');
    el.classList.add('visible');
    void el.offsetHeight; // force reflow so the next class change transitions
    el.classList.add('open');
  }
  function closeFullscreen(){
    const el = document.getElementById('fullscreen-np');
    el.classList.remove('open');
    setTimeout(() => { if(!el.classList.contains('open')) el.classList.remove('visible'); }, 450);
  }
  document.getElementById('mini-expand').addEventListener('click', openFullscreen);
  document.getElementById('mini-cover').addEventListener('click', openFullscreen);
  document.getElementById('np-close').addEventListener('click', closeFullscreen);
  document.getElementById('np-scrim').addEventListener('click', closeFullscreen);

  function setTab(tab){
    const root = document.getElementById('fullscreen-np');
    const shouldShowQueue = tab === 'queue';
    if(tab === npTab && root.classList.contains('tab-queue') === shouldShowQueue){
      return;
    }
    npTab = tab;
    const lyricsPanel = document.getElementById('np-lyrics-panel');
    const queuePanel = document.getElementById('np-queue-panel');
    const showingQueue = tab === 'queue';
    const outgoing = showingQueue ? lyricsPanel : queuePanel;
    const incoming = showingQueue ? queuePanel : lyricsPanel;
    // crossfade: fade the outgoing panel out, prime the incoming one at opacity 0
    // (harmless while it's still display:none), swap which one is in the flow,
    // then fade the incoming one in — instead of an instant display swap
    outgoing.style.opacity = '0';
    incoming.style.opacity = '0';
    root.classList.toggle('tab-queue', showingQueue);
    setTimeout(() => {
      requestAnimationFrame(() => { incoming.style.opacity = '1'; });
    }, 140);
    const lyricsUtil = document.getElementById('np-util-lyrics');
    const queueUtil = document.getElementById('np-util-queue');
    if(lyricsUtil) lyricsUtil.classList.toggle('active', tab === 'lyrics');
    if(queueUtil) queueUtil.classList.toggle('active', tab === 'queue');
    updateLayoutMode();
    renderDesktopRail();
  }

  // Apple Music collapses the split view and centers the art/controls column
  // when the current track has no lyrics to show — only while on the lyrics
  // tab; the queue tab always keeps the two-column layout.
  function updateLayoutMode(){
    const d = getActive();
    const hasLyrics = !!(d && (d.lyrics || '').trim());
    document.getElementById('fullscreen-np').classList.toggle('centered', npTab === 'lyrics' && !hasLyrics);
  }

  function setActiveNav(navId){
    document.querySelectorAll('.am-primary-nav .am-nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.id === navId);
    });
  }

  function scrollMainTo(selector){
    const main = document.getElementById('main');
    const target = document.querySelector(selector);
    if(!main || !target) return;
    const top = target.offsetTop - 14;
    main.scrollTo({ top, behavior:'smooth' });
  }

  function wireShellNav(){
    const searchBtn = document.getElementById('nav-search');
    const listenBtn = document.getElementById('nav-listen');
    const libraryBtn = document.getElementById('nav-library');
    const radioBtn = document.getElementById('nav-radio');
    if(searchBtn){
      searchBtn.addEventListener('click', () => {
        setView('search');
      });
    }
    if(listenBtn){
      listenBtn.addEventListener('click', () => {
        setView('home');
        scrollMainTo('#listen-now-section');
      });
    }
    if(libraryBtn){
      libraryBtn.addEventListener('click', () => {
        setView('new');
      });
    }
    if(radioBtn){
      radioBtn.addEventListener('click', () => {
        setView('radio');
      });
    }
    const openInMusicBtn = document.getElementById('open-in-music-btn');
    if(openInMusicBtn){
      openInMusicBtn.addEventListener('click', () => {
        window.open('https://music.apple.com/', '_blank');
      });
    }
    const signInBtn = document.getElementById('sign-in-btn');
    if(signInBtn){
      signInBtn.addEventListener('click', () => {
        window.open('https://music.apple.com/account/settings', '_blank');
      });
    }
    const libraryEditBtn = document.getElementById('library-edit-btn');
    if(libraryEditBtn){
      libraryEditBtn.addEventListener('click', () => {
        setView('songs');
      });
    }
  }

  function wireUtilityButtons(){
    const lyricsBtn = document.getElementById('np-util-lyrics');
    const queueBtn = document.getElementById('np-util-queue');
    const shuffleBtn = document.getElementById('np-shuffle');
    const repeatBtn = document.getElementById('np-repeat');
    if(lyricsBtn) lyricsBtn.addEventListener('click', () => setTab('lyrics'));
    if(queueBtn) queueBtn.addEventListener('click', () => setTab('queue'));
    if(shuffleBtn) shuffleBtn.addEventListener('click', () => {
      shuffleOn = !shuffleOn;
      shuffleBtn.classList.toggle('active', shuffleOn);
    });
    if(repeatBtn) repeatBtn.addEventListener('click', () => {
      repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
      repeatBtn.classList.toggle('active', repeatMode !== 'off');
      repeatBtn.title = repeatMode === 'off' ? 'Repeat off' : (repeatMode === 'all' ? 'Repeat all' : 'Repeat one');
    });
    const miniLyricsBtn = document.getElementById('mini-open-lyrics');
    const miniQueueBtn = document.getElementById('mini-open-queue');
    if(miniLyricsBtn) miniLyricsBtn.addEventListener('click', () => { openFullscreen(); setTab('lyrics'); });
    if(miniQueueBtn) miniQueueBtn.addEventListener('click', () => { openFullscreen(); setTab('queue'); });
    const desktopLyricsBtn = document.getElementById('desktop-tab-lyrics');
    const desktopQueueBtn = document.getElementById('desktop-tab-queue');
    const desktopFullscreenBtn = document.getElementById('desktop-open-fullscreen');
    if(desktopLyricsBtn) desktopLyricsBtn.addEventListener('click', () => setTab('lyrics'));
    if(desktopQueueBtn) desktopQueueBtn.addEventListener('click', () => setTab('queue'));
    if(desktopFullscreenBtn) desktopFullscreenBtn.addEventListener('click', openFullscreen);
  }
  // Decorative window chrome — mirrors the real app's controls closely enough
  // to sell the look, without wiring up real PiP/AirPlay/mini-player behavior.
  const npPill = document.getElementById('np-pill');
  if(npPill) npPill.addEventListener('click', closeFullscreen);
  const npPip = document.getElementById('np-pip');
  if(npPip) npPip.addEventListener('click', () => npPip.classList.toggle('active'));
  const npAirplay = document.getElementById('np-airplay');
  if(npAirplay) npAirplay.addEventListener('click', () => npAirplay.classList.toggle('active'));
  const npFavorite = document.getElementById('np-favorite');
  if(npFavorite) npFavorite.addEventListener('click', () => npFavorite.classList.toggle('active'));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.getElementById('fullscreen-np').classList.contains('open')){
      closeFullscreen();
    }
    if(e.key === ' ' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      togglePlay();
    }
  });

  // ---------- boot ----------
  wireShellNav();
  wireUtilityButtons();
  renderSongLists();
  if(currentIdx >= 0){
    renderNowPlayingInfo();
    renderLyrics();
  } else {
    document.getElementById('np-title').textContent = '';
    document.getElementById('np-artist').textContent = '';
  }
</script>
