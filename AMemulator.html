<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music — Preview</title>
<script>
  // ---------- access gate ----------
  // This file has no server of its own to check identity against, so it trusts
  // a flag that index.html sets ONLY while the currently-signed-in Google account
  // is the real owner account (see syncEmulatorAccessFlag() in index.html), and
  // clears the instant that stops being true. Anyone who lands here without that
  // flag — i.e. anyone who didn't come from the admin panel's "Apple Music
  // emulator" button — gets bounced straight back to the main site.
  (function(){
    try{
      if(localStorage.getItem('emulator_access') !== 'true'){
        window.location.replace('index.html');
      }
    }catch(e){
      window.location.replace('index.html');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root{
    --font-apple: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif;
    --bg: #1f1f1f;
    --sidebar-bg: rgba(38,38,40,0.6);
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --text: rgba(255,255,255,0.92);
    --text-dim: rgba(255,255,255,0.74);
    --text-faint: rgba(255,255,255,0.5);
    --muted: rgba(255,255,255,0.6);
    --accent: #fa2d48;
    --accent-2: #ff5e78;
    --row-hover: rgba(255,255,255,0.06);
    --row-active: rgba(250,45,72,0.16);
    --shadow-soft: 0 18px 44px rgba(0,0,0,0.34);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: var(--font-apple);
    background: var(--bg);
    color: var(--text);
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button{ font-family: inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.14); border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.24); }
  ::-webkit-scrollbar-track{ background:transparent; }

  #app{ display:flex; flex-direction:column; height:100%; }
  #main-row{ flex:1; display:flex; min-height:0; }

  /* ---------- sidebar ---------- */
  #sidebar{
    width: 244px;
    flex-shrink:0;
    background: var(--sidebar-bg);
    -webkit-backdrop-filter: saturate(2.2) blur(16px);
    backdrop-filter: saturate(2.2) blur(16px);
    border-right: 1px solid rgba(255,255,255,0.2);
    display:flex;
    flex-direction:column;
    padding: 0;
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.04);
  }
  .brand-row{
    display:flex; align-items:center; gap:9px;
    padding: 13px 12px 12px;
    margin-bottom: 0;
  }
  .brand-dot{
    width:auto; height:auto; border-radius:0;
    background: transparent;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    box-shadow: none;
    color: rgba(255,255,255,0.92);
    font-weight:500;
  }
  .brand-name{ font-weight:600; font-size:14px; letter-spacing:-0.1px; color: rgba(255,255,255,0.92); }
  .am-nav-list{ display:flex; flex-direction:column; gap:4px; }
  .am-primary-nav{ margin: 0 8px 8px; }
  .am-nav-btn{
    width:100%; display:flex; align-items:center; gap:10px; padding:10px 11px;
    border:none; border-radius:8px; background:transparent; color:var(--text-dim);
    cursor:pointer; font-size:13px; font-weight:500; text-align:left;
    transition: background .15s ease, color .15s ease, transform .12s ease;
    position: relative;
  }
  .am-nav-btn:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .am-nav-btn.active{
    background: rgba(255,255,255,0.14);
    color:#fff;
    box-shadow: none;
  }
  .am-nav-btn.active::before{
    content:'';
    display:none;
  }
  .am-nav-btn.active svg{ filter: none; }
  .am-nav-btn svg{ width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  .brand-row .brand-name{ margin-right:auto; }

  .sidebar-actions{ display:none; }
  .sidebar-action-btn{
    width:100%;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 8px 10px;
    font-size:12px;
    font-weight:500;
    text-align:left;
    cursor:pointer;
  }
  .sidebar-action-btn:hover{ color:#fff; border-color: rgba(255,255,255,0.2); }

  .side-section-title{
    font-size: 11px; font-weight:500; text-transform:none; letter-spacing:0.1px;
    color: var(--text-faint);
    padding: 10px 11px 6px;
  }
  .side-section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 12px 6px;
  }
  .side-section-header .side-section-title{ padding: 0; }
  .side-edit-btn{
    border:none;
    background:transparent;
    color: var(--text-faint);
    font-size:11px;
    cursor:pointer;
    padding: 0;
  }
  .side-edit-btn:hover{ color:#fff; }
  .side-link-list{ display:flex; flex-direction:column; gap:1px; margin: 0 8px 8px; }
  .side-link-btn{
    width:100%; border:none; background:transparent; color: var(--text-dim);
    padding: 7px 10px; border-radius:7px; text-align:left; font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; gap:9px;
    transition: background .14s ease, color .14s ease;
  }
  .side-link-btn:hover{ color:#fff; background: rgba(255,255,255,0.06); }
  .side-link-btn svg{ width:14px; height:14px; fill:currentColor; flex-shrink:0; opacity:0.9; }
  .side-nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 7px 10px;
    border-radius:7px;
    font-size:13px;
    color: var(--text-dim);
    cursor:pointer;
    user-select:none;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .side-nav-item svg{ width:16px; height:16px; fill:currentColor; flex-shrink:0; }
  .side-nav-item:hover{ background: var(--row-hover); color: var(--text); }
  .side-nav-item.active{
    background: rgba(255,255,255,0.14);
    color: #fff;
    box-shadow: none;
  }

  #song-list-nav{ flex:1; overflow-y:auto; margin: 4px 8px 0; min-height: 120px; }
  .side-song-item{
    display:flex; align-items:center; gap:9px;
    padding: 7px 11px;
    border-radius:8px;
    cursor:pointer;
    transition: background .15s ease, transform .12s ease;
  }
  .side-song-item:hover{ background: var(--row-hover); }
  .side-song-item.playing{ background: var(--row-active); }
  .side-song-cover{
    width:30px; height:30px; border-radius:6px; object-fit:cover; flex-shrink:0;
    background: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .side-song-text{ min-width:0; }
  .side-song-title{
    font-size:12.5px; font-weight:700; color: var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    letter-spacing:-0.1px;
  }
  .side-song-item.playing .side-song-title{ color: var(--accent); }
  .side-song-artist{
    font-size:11px; color: var(--text-faint);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .empty-side-note{ color: var(--text-faint); font-size:12px; padding: 10px 12px; line-height:1.5; }

  /* ---------- main / library view ---------- */
  #main{
    flex:1; min-width:0;
    overflow-y:auto;
    padding: 0;
    background: transparent;
    box-shadow: none;
  }
  #main h1{ font-size: 34px; font-weight:700; letter-spacing:0; margin: 0 0 2px; }
  #main .lib-sub{ color: var(--text-faint); font-size:12.5px; margin-bottom: 18px; }
  #library-body{ max-width: 1050px; }
  #main-head{ padding: 22px 30px 0; }
  #main-content{ padding: 0 30px 64px; }
  .home-intro{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.18;
    margin: 2px 0 16px;
    color: rgba(255,255,255,0.94);
  }
  .home-intro span{
    display:block;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.45;
    color: rgba(255,255,255,0.58);
    max-width: 560px;
    letter-spacing: 0;
  }

  .am-hero{
    display:grid; grid-template-columns: 1.3fr 0.9fr; gap:18px;
    padding: 18px 20px; margin-bottom: 22px;
    border:1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    box-shadow: none;
  }
  .am-hero-copy h2{
    font-size: 27px; font-weight: 800; letter-spacing: -0.52px; margin-bottom: 6px;
    color: #fff;
  }
  .am-hero-copy p{
    color: var(--text-dim); font-size: 12.5px; line-height: 1.62; max-width: 540px;
  }
  .am-hero-stats{
    display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px;
  }
  .am-stat{
    padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow: none;
  }
  .am-stat-label{ font-size:11px; text-transform:uppercase; color: var(--text-faint); letter-spacing:0.4px; }
  .am-stat-value{ font-size:21px; font-weight: 700; margin-top:5px; }

  .am-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap:14px; }
  .am-section{ margin-top: 18px; }
  .am-section-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom: 10px;
  }
  .am-section-title{
    font-size: 17px; font-weight: 700; letter-spacing: -0.22px;
  }
  .am-section-link{
    border:none; background: rgba(255,255,255,0.05); color: var(--text-dim);
    border-radius: 999px; padding: 5px 10px; font-size: 10.5px; font-weight:700;
    cursor:pointer;
  }
  .am-card{
    position:relative; display:flex; flex-direction:column; gap:10px;
    padding: 10px; border-radius: 10px; cursor:pointer;
    background: rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.1); transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow: none;
    overflow:hidden;
  }
  .am-card::before{
    display:none;
  }
  .am-card:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); box-shadow: none; }
  .am-card.playing{ border-color: rgba(255,255,255,0.26); background: rgba(255,255,255,0.12); }
  .am-card-cover{
    width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; overflow:hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .am-card-title{ font-size:13px; font-weight:700; }
  .am-card-artist{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
  .am-card-meta{ display:flex; justify-content:space-between; align-items:center; color: var(--text-faint); font-size:11px; }
  .am-card-badge{ padding:2px 6px; border-radius:999px; background: rgba(255,255,255,0.06); }
  .shelf-section{ margin-top: 18px; }
  .shelf-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap:12px; }
  .shelf-card{
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: border-color .14s ease, background .14s ease, transform .14s ease;
  }
  .shelf-card:hover{ border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); transform: translateY(-1px); }
  .shelf-title{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shelf-sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
  .am-list-wrap{
    margin-top: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .songs-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top: 10px;
    padding: 8px 2px;
  }
  .songs-toolbar-left{ display:flex; align-items:center; gap:8px; }
  .songs-toolbar-right{ display:flex; align-items:center; gap:8px; }
  .songs-ctl-btn{
    border:1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    border-radius:999px;
    padding: 6px 11px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }
  .songs-ctl-btn:hover{ color:#fff; border-color: rgba(255,255,255,0.2); }
  .songs-select{
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    border-radius:9px;
    padding: 6px 8px;
    font-size:11px;
  }
  .songs-table-wrap{
    margin-top: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
  }
  table.songs-table{ width:100%; border-collapse: collapse; }
  table.songs-table th{
    text-align:left;
    font-size:11px;
    color: var(--text-faint);
    letter-spacing:0.3px;
    padding: 9px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  table.songs-table td{
    font-size:12.5px;
    color: var(--text-dim);
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  table.songs-table tr{ cursor:pointer; }
  table.songs-table tr:hover{ background: rgba(255,255,255,0.05); }
  table.songs-table tr.playing td{ color: var(--accent); }
  .songs-fav-col{ width: 86px; }
  .songs-time-col{ width: 68px; text-align:right; }
  .song-name-cell{ display:flex; align-items:center; gap:9px; }
  .song-name-play{
    border:none;
    width:22px;
    height:22px;
    border-radius:6px;
    background: rgba(255,255,255,0.12);
    color: var(--text-dim);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
  }
  .song-name-play:hover{ color:#fff; background: rgba(255,255,255,0.14); }
  .row-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
  .row-action-btn{
    border:none;
    background: rgba(255,255,255,0.1);
    color: var(--text-dim);
    width:22px;
    height:22px;
    border-radius:6px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:pointer;
  }
  .row-action-btn:hover{ color:#fff; background: rgba(255,255,255,0.13); }
  .row-action-btn.active{ color: var(--accent); }
  .am-search-wrap{
    margin-top: 6px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    background: rgba(255,255,255,0.03);
  }
  .am-search-input{
    width:100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    color:#fff;
    font-size:13px;
    outline:none;
  }
  .am-search-input::placeholder{ color: var(--text-faint); }
  .am-search-input:focus{ border-color: rgba(255,255,255,0.26); box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
  .am-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top: 12px; }
  .am-chip{ border:1px solid rgba(255,255,255,0.14); border-radius:999px; padding: 5px 10px; color: var(--text-dim); font-size:11px; }
  .radio-list{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
  .radio-card{
    border:1px solid rgba(255,255,255,0.07);
    border-radius:12px;
    padding:12px;
    background: rgba(255,255,255,0.03);
    cursor:pointer;
    transition: background .14s ease, border-color .14s ease, transform .14s ease;
  }
  .radio-card:hover{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.16); transform: translateY(-1px); }
  .radio-title{ font-size:12.5px; font-weight:700; }
  .radio-sub{ font-size:11px; color: var(--text-faint); margin-top:2px; }
  @media (max-width: 880px){ .am-hero{ grid-template-columns: 1fr; } }

  table.song-table{ width:100%; border-collapse:separate; border-spacing:0 1px; }
  table.song-table thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color: var(--text-faint);
    font-weight:700;
    padding: 0 12px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  table.song-table thead th.num-col{ width:34px; }
  table.song-table thead th.dur-col{ width:70px; text-align:right; }
  table.song-table tbody tr{
    cursor:pointer;
    border-radius:10px;
    transition: background .12s ease, transform .12s ease;
  }
  table.song-table tbody tr:hover{ background: rgba(255,255,255,0.06); }
  table.song-table tbody tr.playing td{ color: var(--accent); }
  table.song-table tbody tr.playing{ box-shadow: inset 0 0 0 1px rgba(255,55,95,0.2); }
  table.song-table td{
    padding: 9px 12px;
    font-size: 13px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align:middle;
    transition: color .15s ease;
  }
  td.num-col{ color: var(--text-faint); font-variant-numeric: tabular-nums; }
  td.title-col{ display:flex; align-items:center; gap:11px; color: var(--text); font-weight:600; }
  .row-cover{ width:34px; height:34px; border-radius:6px; object-fit:cover; background: rgba(255,255,255,0.08); flex-shrink:0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
  .row-title-wrap{ min-width:0; }
  .row-title-wrap .row-artist{ font-weight:400; color: var(--text-faint); font-size:12px; margin-top:1px; }
  td.dur-col{ text-align:right; font-variant-numeric: tabular-nums; color: var(--text-faint); }
  .row-cover-wrap{ position:relative; width:34px; height:34px; flex-shrink:0; border-radius:6px; overflow:hidden; box-shadow: 0 6px 14px rgba(0,0,0,0.3); }
  .row-hover-play{
    position:absolute; inset:0;
    background: rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity .15s ease;
  }
  tr:hover .row-hover-play{ opacity:1; }
  tr.playing .row-hover-play{ display:none; }
  .row-hover-play svg{ width:13px; height:13px; fill:#fff; }
  .row-eq{
    position:absolute; inset:0;
    display:none;
    align-items:flex-end; justify-content:center; gap:3px;
    background: rgba(0,0,0,0.55);
    padding-bottom: 8px;
  }
  tr.playing .row-eq{ display:flex; }
  .row-eq span{ width:3px; background: var(--accent); border-radius:1px; height:60%; transform-origin: bottom; animation: eqBounce 0.9s ease-in-out infinite; }
  .row-eq span:nth-child(1){ animation-delay: -0.6s; }
  .row-eq span:nth-child(2){ animation-delay: -0.2s; }
  .row-eq span:nth-child(3){ animation-delay: -0.9s; }
  tr.playing.row-paused .row-eq span{ animation-play-state: paused; transform: scaleY(0.4); }
  @keyframes eqBounce{ 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

  #empty-library{
    color: var(--text-faint);
    font-size: 14px;
    line-height:1.9;
    padding-top: 20px;
    max-width: 460px;
  }
  #empty-library b{ color: var(--text-dim); }

  /* ---------- bottom mini player ---------- */
  #mini-player{
    display:none;
    flex-shrink:0;
    height: 72px;
    border-top: 1px solid rgba(255,255,255,0.14);
    background: rgba(50,50,50,0.92);
    -webkit-backdrop-filter: blur(20px) saturate(1.05);
    backdrop-filter: blur(20px) saturate(1.05);
    align-items:center;
    padding: 0 18px;
    gap: 14px;
    transform: translateY(100%);
    opacity: 0;
    transition: transform .38s cubic-bezier(.32,.72,.35,1), opacity .3s ease;
    box-shadow: none;
  }
  #mini-player.visible{ display:flex; }
  #mini-player.has-track{ transform: translateY(0); opacity:1; }
  .mini-track-info{ display:flex; align-items:center; gap:10px; width:230px; flex-shrink:0; min-width:0; }
  .mini-cover{ width:42px; height:42px; border-radius:5px; object-fit:cover; background: rgba(255,255,255,0.08); flex-shrink:0; cursor:pointer; transition: opacity .25s ease; }
  .mini-text{ min-width:0; }
  .mini-title{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-artist{ font-size:11.5px; color: var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .mini-center{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; max-width: 620px; margin: 0 auto; }
  .mini-transport-buttons{ display:flex; align-items:center; gap: 18px; }
  .mini-btn{ background:none; border:none; cursor:pointer; color:#fff; opacity:0.82; display:flex; align-items:center; justify-content:center; padding:0; transition: opacity .15s ease, transform .1s ease; }
  .mini-btn:hover{ opacity:1; }
  .mini-btn:active{ transform: scale(0.9); }
  .mini-btn svg{ width:15px; height:15px; fill:currentColor; }
  .mini-play-btn{ width:30px; height:30px; border-radius:50%; background: rgba(255,255,255,0.16); box-shadow: none; }
  .mini-play-btn svg{ width:21px; height:21px; }
  .mini-scrub-row{ display:flex; align-items:center; gap:8px; width:100%; }
  .mini-time{ font-size:10.5px; color: var(--text-faint); width:34px; font-variant-numeric: tabular-nums; }
  .mini-time.right{ text-align:left; }
  .mini-scrub-track{ position:relative; flex:1; height:3px; border-radius:999px; background: rgba(255,255,255,0.2); cursor:pointer; }
  .mini-scrub-fill{ position:absolute; top:0; left:0; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg, #fff, #f1f1f1); }
  .mini-scrub-dot{ position:absolute; top:50%; left:0%; width:10px; height:10px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); opacity:0; transition: opacity .15s; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
  .mini-scrub-track:hover .mini-scrub-dot{ opacity:1; }

  .mini-right{ width:230px; flex-shrink:0; display:flex; align-items:center; justify-content:flex-end; gap:14px; }
  .mini-quick-actions{ display:flex; align-items:center; gap:8px; }
  .mini-quick-btn{
    border:none;
    background: transparent;
    color: var(--text-dim);
    width:26px;
    height:26px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .mini-quick-btn svg{ width:14px; height:14px; fill:currentColor; }
  .mini-quick-btn:hover{ color:#fff; background: rgba(255,255,255,0.1); }
  .mini-vol-row{ display:flex; align-items:center; gap:6px; width:100px; }
  .mini-vol-row input[type="range"]{ width:100%; accent-color:#fff; }
  .mini-expand-btn{ background:none; border:none; cursor:pointer; color: var(--text-dim); display:flex; transition: color .15s ease; }
  .mini-expand-btn:hover{ color:#fff; }
  .mini-expand-btn svg{ width:15px; height:15px; fill:currentColor; }

  /* ---------- fullscreen now playing ---------- */
  #fullscreen-np{
    display:none;
    position:fixed; inset:0;
    z-index:50;
    background: linear-gradient(180deg, rgba(30,30,31,0.94), rgba(17,17,18,0.98));
    flex-direction:column;
  }
  #fullscreen-np.visible{ display:flex; }
  #fullscreen-np.open #np-panel-inner{
    transform: translateY(0);
    opacity:1;
  }
  #np-panel-inner{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    transform: translateY(28px);
    opacity:0;
    transition: transform .42s cubic-bezier(.32,.72,.35,1), opacity .32s ease;
  }
  #np-backdrop{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    filter: blur(70px) saturate(1.5) brightness(0.55);
    opacity:0;
    transition: opacity .5s ease, background-image .5s ease;
  }
  #np-backdrop.has-cover{ opacity: 0.9; }
  #np-scrim{ position:absolute; inset:0; background: rgba(0,0,0,0.35); }
  #np-top-row{ position:relative; z-index:2; display:flex; align-items:center; padding: 18px 26px 0; }
  .np-close-btn{ background:none; border:none; color: rgba(255,255,255,0.7); cursor:pointer; padding:6px; transition: color .15s ease, transform .12s ease; }
  .np-close-btn:hover{ color:#fff; }
  .np-close-btn:active{ transform: scale(0.88); }
  .np-close-btn svg{ width:19px; height:19px; fill:currentColor; }
  .np-tabs{ margin-left:auto; display:flex; gap:4px; background: rgba(255,255,255,0.08); border-radius:8px; padding:3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
  .np-tab-btn{
    background:none; border:none; cursor:pointer; color: rgba(255,255,255,0.55);
    font-size:12px; font-weight:600; padding: 6px 12px; border-radius:6px;
    transition: color .15s ease, background .15s ease;
  }
  .np-tab-btn:hover{ color: rgba(255,255,255,0.85); }
  .np-tab-btn.active{ background: rgba(255,255,255,0.16); color:#fff; }

  #np-body{
    position:relative; z-index:2;
    flex:1; min-height:0;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap: 54px;
    padding: 10px 60px 20px;
  }
  #np-art-col{ display:flex; flex-direction:column; align-items:center; width: 360px; flex-shrink:0; padding-top: 10px; }
  #np-cover{
    width: 340px; height:340px; border-radius:18px;
    object-fit:cover;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    background: rgba(255,255,255,0.06);
    transition: opacity .28s ease, transform .28s ease;
  }
  #np-cover-placeholder{
    width:340px; height:340px; border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.1);
    font-size:56px; color: rgba(255,255,255,0.24);
    transition: opacity .28s ease;
  }
  #np-title, #np-artist{ transition: opacity .25s ease; }
  #np-title{ font-size:22px; font-weight:800; margin-top:22px; text-align:center; letter-spacing:-0.3px; }
  #np-artist{ font-size:14px; color: rgba(255,255,255,0.55); margin-top:4px; text-align:center; }

  #np-lyrics-panel, #np-queue-panel{
    flex:1; max-width: 700px; height:100%;
    overflow-y:auto;
    padding: 12px 6px 40px;
    scroll-behavior:smooth;
    transition: opacity .22s ease;
    border-left: 1px solid rgba(255,255,255,0.06);
    padding-left: 20px;
  }
  #np-queue-panel{ display:none; }
  #fullscreen-np.tab-queue #np-lyrics-panel{ display:none; }
  #fullscreen-np.tab-queue #np-queue-panel{ display:block; }

  .np-lyric-section{ margin-bottom: 8px; margin-top: 26px; }
  .np-lyric-section:first-child{ margin-top: 0; }
  .np-section-tag{
    /* Apple Music's Lyrics tab doesn't print section labels — this is kept as an
       invisible spacer so section breaks still get the extra breathing room a
       label would have implied, without showing the [Verse]/[Chorus] text. */
    height: 0;
    overflow:hidden;
  }
  .np-lyric-line{
    font-size: 26px; font-weight:700; line-height:1.38; letter-spacing:-0.22px;
    color: rgba(255,255,255,0.48);
    margin-bottom: 10px;
    transition: color .35s ease, transform .35s ease, opacity .35s ease;
    position:relative;
    cursor: default;
    transform-origin: left center;
    text-wrap: balance;
  }
  .np-lyric-line.blank{ height:20px; }
  .np-lyric-line.clickable{ cursor:pointer; }
  .np-lyric-line.clickable:hover{ color: rgba(255,255,255,0.72); }
  .np-lyric-line.active-sync{ color: rgba(255,255,255,0.82); transform: scale(1.02); }
  .np-word{ transition: color .1s linear; }
  .np-lyric-line.active-sync .np-word.sung-word{ color: #ffffff; }
  .np-lyric-line.active-sync .np-word.active-word{ color: #ffffff; text-shadow: 0 0 18px rgba(255,255,255,0.48); }
  .np-line-fill-wrap{ position:relative; display:inline-block; }
  .np-line-fill{
    position:absolute; top:0; left:0; right:0;
    color: #ffffff;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--wipe,0%) - 6%), transparent var(--wipe,0%));
    mask-image: linear-gradient(90deg, #000 calc(var(--wipe,0%) - 6%), transparent var(--wipe,0%));
    pointer-events:none;
  }

  #np-no-lyrics{ color: rgba(255,255,255,0.4); font-size:14px; padding-top:20px; }

  .np-queue-row{ display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:10px; cursor:pointer; }
  .np-queue-row:hover{ background: rgba(255,255,255,0.06); }
  .np-queue-row.current{ background: rgba(255,255,255,0.14); }
  .np-queue-cover{ width:44px; height:44px; border-radius:7px; object-fit:cover; background: rgba(255,255,255,0.08); flex-shrink:0; }
  .np-queue-title{ font-size:13px; font-weight:600; }
  .np-queue-row.current .np-queue-title{ color: var(--accent); }
  .np-queue-artist{ font-size:11.5px; color: rgba(255,255,255,0.4); }

  #np-bottom{ position:relative; z-index:2; padding: 4px 60px 26px; }
  .np-scrub-row{ max-width:540px; margin:0 auto; }
  .np-scrub-track{ position:relative; width:100%; height:4px; border-radius:2px; background: rgba(255,255,255,0.22); cursor:pointer; }
  .np-scrub-fill{ position:absolute; top:0; left:0; height:100%; width:0%; border-radius:2px; background:#fff; }
  .np-scrub-dot{ position:absolute; top:50%; left:0%; width:11px; height:11px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,0.4); }
  .np-time-row{ display:flex; justify-content:space-between; font-size:10.5px; color: rgba(255,255,255,0.45); margin-top:7px; max-width:540px; margin-left:auto; margin-right:auto; }
  .np-transport-buttons{ display:flex; align-items:center; justify-content:center; gap:30px; margin-top:12px; }
  .np-transport-btn{ background:none; border:none; cursor:pointer; color:#fff; width:34px; height:34px; display:flex; align-items:center; justify-content:center; padding:0; opacity:0.85; transition: opacity .15s ease, transform .1s ease; }
  .np-transport-btn:hover{ opacity:1; }
  .np-transport-btn:active{ transform: scale(0.92); }
  .np-transport-btn svg{ width:20px; height:20px; fill:currentColor; }
  .np-play-btn{ width:48px; height:48px; }
  .np-play-btn svg{ width:30px; height:30px; }
  .np-utility-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin-top: 12px;
  }
  .np-utility-btn{
    border:none;
    background:none;
    color: rgba(255,255,255,0.55);
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: color .12s ease, transform .1s ease;
  }
  .np-utility-btn:hover{ color:#fff; }
  .np-utility-btn.active{ color: var(--accent); }
  .np-utility-btn:active{ transform: scale(0.92); }
  .np-utility-btn svg{ width:17px; height:17px; fill:currentColor; }

  /* ---------- load-audio prompt ---------- */
  #load-audio-banner{
    display:none;
    align-items:center; gap:12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius:10px;
    padding: 10px 14px;
    font-size:12.5px;
    color: rgba(255,255,255,0.65);
    max-width:520px;
    margin: 0 auto 14px;
  }
  #load-audio-banner.show{ display:flex; }
  #load-audio-banner button{
    background:#fff; color:#000; border:none; border-radius:16px;
    padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0;
  }

  @media (max-width: 900px){
    #sidebar{ width:210px; }
    #np-body{ flex-direction:column; gap:20px; padding: 10px 24px 20px; }
    #np-art-col{ width:auto; }
    #np-cover, #np-cover-placeholder{ width:180px; height:180px; }
    #np-lyrics-panel, #np-queue-panel{ max-width:100%; width:100%; border-left:none; padding-left:4px; }
    .mini-track-info{ width:150px; }
    .mini-right{ width:60px; }
    .mini-vol-row{ display:none; }
  }

  @media (max-width: 760px){
    body{ overflow:auto; }
    #main-row{ flex-direction:column; }
    #sidebar{ width:auto; min-height:auto; border-right:none; border-bottom:1px solid rgba(255,255,255,0.06); }
    #search-wrap{ padding-bottom:12px; }
    #main{ padding: 24px 18px 80px; }
    #main h1{ font-size:28px; }
    #library-body{ max-width:none; }
    .am-hero{ grid-template-columns:1fr; padding:16px; }
    .am-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    #mini-player{ height:auto; padding:10px 12px; min-height:84px; }
    .mini-track-info{ width:auto; }
    .mini-right{ width:auto; }
    .mini-center{ max-width:none; }
    .mini-scrub-row{ width:100%; }
    #np-body{ gap:14px; padding: 8px 16px 20px; }
    #np-art-col{ width:100%; }
    #np-cover, #np-cover-placeholder{ width:220px; height:220px; }
    #np-title{ font-size:20px; }
    #np-lyrics-panel, #np-queue-panel{ padding: 6px 0 20px; }
    .np-lyric-line{ font-size:22px; }
    #np-bottom{ padding: 4px 18px 20px; }
    .np-transport-buttons{ gap: 20px; }
  }

  @media (max-width: 520px){
    #sidebar{ padding:12px 10px; }
    .brand-row{ gap:8px; }
    #search-wrap{ padding: 0 0 12px; }
    .brand-name{ font-size:14px; }
    .am-nav-list{ gap:2px; }
    .am-nav-btn{ padding:9px 10px; }
    .mini-track-info{ display:none; }
    .mini-right{ display:none; }
    .mini-center{ width:100%; }
    .mini-transport-buttons{ gap:16px; }
    #np-top-row{ padding: 14px 14px 0; }
    .np-tabs{ margin-left:0; }
    .np-scrub-row, .np-time-row{ max-width:none; }
    .np-transport-buttons{ gap:16px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="main-row">
    <!-- ---------- sidebar ---------- -->
    <div id="sidebar">
      <div class="brand-row">
        <div class="brand-dot"></div>
        <div class="brand-name">Music</div>
      </div>
      <div class="am-nav-list am-primary-nav">
        <button class="am-nav-btn" id="nav-search" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 6.5C4 5.12 5.12 4 6.5 4h11C18.88 4 20 5.12 20 6.5v11c0 1.38-1.12 2.5-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Zm3 1.25h4v4H7v-4Zm6 0h4v4h-4v-4ZM7 13.25h4v4H7v-4Zm6 0h4v4h-4v-4Z"/></svg>
          Search
        </button>
        <button class="am-nav-btn active" id="nav-listen" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 6.75A2.75 2.75 0 0 1 6.75 4h10.5A2.75 2.75 0 0 1 20 6.75v10.5A2.75 2.75 0 0 1 17.25 20H6.75A2.75 2.75 0 0 1 4 17.25V6.75Zm5.2 2.4v5.7l5-2.85-5-2.85Z"/></svg>
          Home
        </button>
        <button class="am-nav-btn" id="nav-library" type="button">
          <svg viewBox="0 0 24 24"><path d="M5.75 4A1.75 1.75 0 0 0 4 5.75v12.5C4 19.216 4.784 20 5.75 20h12.5A1.75 1.75 0 0 0 20 18.25V5.75A1.75 1.75 0 0 0 18.25 4H5.75Zm2.5 3h7.5a.75.75 0 0 1 0 1.5h-7.5a.75.75 0 0 1 0-1.5Zm0 3.75h7.5a.75.75 0 0 1 0 1.5h-7.5a.75.75 0 0 1 0-1.5Zm0 3.75h5a.75.75 0 0 1 0 1.5h-5a.75.75 0 0 1 0-1.5Z"/></svg>

          <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm-5.7.35a.75.75 0 1 0-1.06-1.06 9.75 9.75 0 0 0 0 13.79.75.75 0 0 0 1.06-1.06 8.25 8.25 0 0 1 0-11.67Zm12.46-1.06a.75.75 0 0 0-1.06 1.06 8.25 8.25 0 0 1 0 11.67.75.75 0 1 0 1.06 1.06 9.75 9.75 0 0 0 0-13.79ZM9.12 12a2.88 2.88 0 0 0-.84-2.04.75.75 0 0 0-1.06 1.06 1.38 1.38 0 0 1 0 1.96.75.75 0 0 0 1.06 1.06c.54-.54.84-1.27.84-2.04Zm6.6-2.04a.75.75 0 0 0-1.06 1.06 1.38 1.38 0 0 1 0 1.96.75.75 0 1 0 1.06 1.06c1.13-1.13 1.13-2.95 0-4.08Z"/></svg>
          Radio
        </button>
      </div>
      <div class="side-section-header">
        <div class="side-section-title">Library</div>
        <button class="side-edit-btn" id="library-edit-btn" type="button">Edit</button>
      </div>
      <div id="library-list-nav" class="side-link-list"></div>
      <div class="side-section-title">Playlists</div>
      <div id="playlist-list-nav" class="side-link-list"></div>
      <div class="side-section-title">Pins</div>
      <div id="song-list-nav"></div>
    </div>

    <!-- ---------- main library ---------- -->
    <div id="main">
      <div id="main-head">
        <h1>Home</h1>
        <div class="lib-sub" id="lib-sub"></div>
      </div>
      <div id="main-content">
        <div id="library-body"></div>
      </div>
    </div>
  </div>

  <!-- ---------- bottom mini player ---------- -->
  <div id="mini-player">
    <div class="mini-track-info">
      <img id="mini-cover" class="mini-cover" alt="">
      <div class="mini-text">
        <div id="mini-title" class="mini-title"></div>
        <div id="mini-artist" class="mini-artist"></div>
      </div>
    </div>
    <div class="mini-center">
      <div class="mini-transport-buttons">
        <button class="mini-btn" id="mini-prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6,6H8V18H6V6M9.5,12L18,6V18L9.5,12Z"/></svg></button>
        <button class="mini-btn mini-play-btn" id="mini-play" title="Play/Pause"><svg id="mini-play-icon" viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg></button>
        <button class="mini-btn" id="mini-next" title="Next"><svg viewBox="0 0 24 24"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg></button>
      </div>
      <div class="mini-scrub-row">
        <span class="mini-time" id="mini-time-elapsed">0:00</span>
        <div class="mini-scrub-track" id="mini-scrub-track">
          <div class="mini-scrub-fill" id="mini-scrub-fill"></div>

        <button class="mini-quick-btn" id="mini-open-queue" title="Up Next"><svg viewBox="0 0 24 24"><path d="M4 7.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 7.25Zm0 4.75a.75.75 0 0 1 .75-.75h9.5a.75.75 0 0 1 0 1.5h-9.5A.75.75 0 0 1 4 12Zm0 4.75a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1-.75-.75ZM17 11l3 2-3 2v-4Z"/></svg></button>

      <button class="mini-expand-btn" id="mini-expand" title="Full screen">
        <svg viewBox="0 0 24 24"><path d="M7,14H5v5h5v-2H7V14z M5,10h2V7h3V5H5V10z M17,17h-3v2h5v-5h-2V17z M14,5v2h3v3h2V5H14z"/></svg>
      </button>

</div>

<!-- ---------- fullscreen now playing ---------- -->
<div id="fullscreen-np">
 <div id="np-panel-inner">
  <div id="np-backdrop"></div>
  <div id="np-scrim"></div>
  <div id="np-top-row">
    <button class="np-close-btn" id="np-close" title="Close"><svg viewBox="0 0 24 24"><path d="M7,10l5,5l5,-5z"/></svg></button>
    <div class="np-tabs">
      <button class="np-tab-btn active" id="np-tab-lyrics">Lyrics</button>
      <button class="np-tab-btn" id="np-tab-queue">Up Next</button>
    </div>
  </div>
  <div id="np-body">
    <div id="np-art-col">
      <img id="np-cover" style="display:none;" alt="">
      <div id="np-cover-placeholder">♪</div>
      <div id="np-title"></div>
      <div id="np-artist"></div>
    </div>
    <div id="np-lyrics-panel">
      <div id="load-audio-banner">
        <span id="load-audio-text">Load this track's audio to hear it play back with synced lyrics.</span>
        <button id="load-audio-btn">Load audio</button>
        <input type="file" id="load-audio-input" accept="audio/*" style="display:none;">
      </div>
      <div id="np-lyrics-content"></div>
    </div>
    <div id="np-queue-panel"></div>
  </div>
  <div id="np-bottom">
    <div class="np-scrub-row">
      <div class="np-scrub-track" id="np-scrub-track">
        <div class="np-scrub-fill" id="np-scrub-fill"></div>
        <div class="np-scrub-dot" id="np-scrub-dot"></div>
      </div>
      <div class="np-time-row">
        <span id="np-time-elapsed">0:00</span>
        <span id="np-time-remaining">-0:00</span>
      </div>
    </div>
    <div class="np-transport-buttons">
      <button class="np-transport-btn" id="np-prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6,6H8V18H6V6M9.5,12L18,6V18L9.5,12Z"/></svg></button>
      <button class="np-transport-btn np-play-btn" id="np-play" title="Play/Pause"><svg id="np-play-icon" viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg></button>
      <button class="np-transport-btn" id="np-next" title="Next"><svg viewBox="0 0 24 24"><path d="M16,18H18V6H16M6,18L14.5,12L6,6V18Z"/></svg></button>
    </div>
    <div class="np-utility-row">
      <button class="np-utility-btn" id="np-util-lyrics" title="Lyrics"><svg viewBox="0 0 24 24"><path d="M5 5.75A1.75 1.75 0 0 1 6.75 4h10.5A1.75 1.75 0 0 1 19 5.75v12.5A1.75 1.75 0 0 1 17.25 20H6.75A1.75 1.75 0 0 1 5 18.25V5.75Zm3 2.25a.75.75 0 0 0 0 1.5h8a.75.75 0 0 0 0-1.5H8Zm0 3.75a.75.75 0 0 0 0 1.5h8a.75.75 0 0 0 0-1.5H8Zm0 3.75a.75.75 0 0 0 0 1.5h5a.75.75 0 0 0 0-1.5H8Z"/></svg></button>
      <button class="np-utility-btn" id="np-util-queue" title="Queue"><svg viewBox="0 0 24 24"><path d="M4 7.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 7.25Zm0 4.75a.75.75 0 0 1 .75-.75h9.5a.75.75 0 0 1 0 1.5h-9.5A.75.75 0 0 1 4 12Zm0 4.75a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1-.75-.75ZM17 11l3 2-3 2v-4Z"/></svg></button>
      <button class="np-utility-btn" id="np-shuffle" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17.59 3 22 7.41l-1.06 1.06-2.35-2.35h-2.34c-1.54 0-2.42.63-3.55 2.2L11 10.75l-1.2-1.2 1.42-1.96C12.64 5.61 14.14 4.5 16.25 4.5h2.34l2.35-2.35L22 3.2 17.59 7.6V3Zm-7.34 9.04 1.2 1.2-1.43 1.97c-1.41 1.96-2.91 3.07-5.02 3.07H2v-1.5h2.99c1.54 0 2.42-.63 3.55-2.2l1.71-2.54Zm8.34 2.24 2.35-2.35L22 13l-4.41 4.41V13h-2.34c-2.11 0-3.61-1.11-5.02-3.07L9 8.28C7.87 6.71 6.99 6.08 5.45 6.08H2v-1.5h3.45c2.11 0 3.61 1.11 5.02 3.07l1.23 1.7c1.13 1.57 2.01 2.2 3.55 2.2h2.34v-4.41Z"/></svg></button>
      <button class="np-utility-btn" id="np-repeat" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10V4l4 4-4 4V9H8v3H6V9a2 2 0 0 1 2-2Zm10 10H7v3l-4-4 4-4v3h9v-3h2v3a2 2 0 0 1-2 2Z"/></svg></button>
    </div>
  </div>
 </div>
</div>

<script>
  const STORAGE_KEY = 'manuscript_lyric_drafts_v1';
  const safeLS = {
    get(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } },
  };

  let drafts = [];
  try{
    const raw = safeLS.get(STORAGE_KEY);
    drafts = raw ? JSON.parse(raw) : [];
  }catch(e){ drafts = []; }
  drafts = drafts.filter(d => !d.scrapped).sort((a,b) => (b.updated||0) - (a.updated||0));

  let currentIdx = drafts.length ? 0 : -1;
  let sessionAudio = { draftId: null, url: null, el: null };
  let npTab = 'lyrics';
  let syncPrevActiveIdx = null;
  let currentView = 'home';
  let searchQuery = '';
  let songsSort = 'recent';
  let favoriteMap = Object.create(null);
  let shuffleOn = false;
  let repeatMode = 'off';

  // ---------- helpers (mirror the main app's lyric/time helpers exactly, so
  // synced drafts render and highlight identically here) ----------
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function wordCount(text){
    const lyricOnly = (text||'').split('\n').filter(l => !/^\s*\[.+\]\s*$/.test(l)).join(' ');
    const t = lyricOnly.trim();
    return t ? t.split(/\s+/).filter(Boolean).length : 0;
  }
  function fmtTime(s){
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m + ':' + sec;
  }
  function normTime(t){
    if(t === undefined || t === null) return undefined;
    if(typeof t === 'number') return { start: t, end: t };
    return t;
  }
  function wordKey(lineIdx, wordIdx){ return lineIdx + ':' + wordIdx; }

  function buildLyricsHtml(lyrics){
    const rawLines = (lyrics||'').split('\n');
    let html = '';
    let sectionOpen = false;
    rawLines.forEach((line, i) => {
      const trimmed = line.trim();
      const tagMatch = trimmed.match(/^\[(.+)\]$/);
      if(tagMatch){
        if(sectionOpen) html += '</div>';
        html += '<div class="np-lyric-section"><div class="np-section-tag">' + escapeHtml(tagMatch[1]) + '</div>';
        sectionOpen = true;
      } else if(trimmed === ''){
        html += '<div class="np-lyric-line blank"></div>';
      } else {
        if(!sectionOpen){ html += '<div class="np-lyric-section">'; sectionOpen = true; }
        const wordSpans = trimmed.split(/\s+/).map((w, wi) =>
          '<span class="np-word" data-word-idx="' + wi + '">' + escapeHtml(w) + '</span>'
        ).join(' ');
        html += '<div class="np-lyric-line clickable" data-idx="' + i + '">' + wordSpans + '</div>';
      }
    });
    if(sectionOpen) html += '</div>';
    return html;
  }

  function getActive(){ return currentIdx >= 0 ? drafts[currentIdx] : null; }

  function getCurrentViewLabel(){
    if(currentView === 'search') return 'Search';
    if(currentView === 'home') return 'Home';
    if(currentView === 'radio') return 'Radio';
    if(currentView === 'songs') return 'Songs';
    if(currentView === 'artists') return 'Artists';
    if(currentView === 'albums') return 'Albums';
    if(currentView === 'videos') return 'Music Videos';
    return 'New';
  }

  function setView(view){
    currentView = view;
    const navId = view === 'search' ? 'nav-search' : (view === 'home' ? 'nav-listen' : (view === 'radio' ? 'nav-radio' : 'nav-library'));
    setActiveNav(navId);
    renderSongLists();
    const main = document.getElementById('main');
    if(main) main.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- sidebar + library rendering ----------
  function renderSongLists(){
    const q = currentView === 'search' ? (searchQuery || '').trim().toLowerCase() : '';
    const filtered = q
      ? drafts.filter(d => (d.title||'').toLowerCase().includes(q) || (d.artist||'').toLowerCase().includes(q))
      : drafts;

    const titleEl = document.querySelector('#main h1');
    if(titleEl) titleEl.textContent = getCurrentViewLabel();

    const libList = document.getElementById('library-list-nav');
    if(libList){
      const itemWithIcon = (label, view) =>
        '<button class="side-link-btn" data-view="' + view + '">' +
          '<svg viewBox="0 0 24 24"><path d="M5 7.25a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H5.75A.75.75 0 0 1 5 7.25Zm0 4.75a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H5.75A.75.75 0 0 1 5 12Zm0 4.75a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H5.75a.75.75 0 0 1-.75-.75Z"/></svg>' +
          label +
        '</button>';
      libList.innerHTML =
        itemWithIcon('Recently Added', 'new') +
        itemWithIcon('Artists', 'artists') +
        itemWithIcon('Albums', 'albums') +
        itemWithIcon('Songs', 'songs') +
        itemWithIcon('Music Videos', 'videos') +
        itemWithIcon('Made for You', 'home');
      libList.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.dataset.view));
      });
    }

    const playlistList = document.getElementById('playlist-list-nav');
    if(playlistList){
      const playIcon = '<svg viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg>';
      playlistList.innerHTML = drafts.length
        ? drafts.slice(0, 6).map(d => '<button class="side-link-btn" data-play-idx="' + drafts.indexOf(d) + '">' + playIcon + escapeHtml(d.title || 'Untitled') + '</button>').join('')
        : '<div class="empty-side-note">No playlists yet.</div>';
      playlistList.querySelectorAll('[data-play-idx]').forEach(btn => {
        btn.addEventListener('click', () => playTrack(Number(btn.dataset.playIdx)));
      });
    }

    const nav = document.getElementById('song-list-nav');
    if(!drafts.length){
      nav.innerHTML = '<div class="empty-side-note">No drafts yet. Head back to the studio and write one — it\'ll show up here as a track.</div>';
    } else if(!filtered.length){
      nav.innerHTML = '<div class="empty-side-note">No matches.</div>';
    } else {
      nav.innerHTML = filtered.map(d => {
        const idx = drafts.indexOf(d);
        return '<div class="side-song-item' + (idx===currentIdx ? ' playing' : '') + '" data-idx="' + idx + '">' +
          (d.cover ? '<img class="side-song-cover" src="' + d.cover + '">' : '<div class="side-song-cover"></div>') +
          '<div class="side-song-text">' +
            '<div class="side-song-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
            '<div class="side-song-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      nav.querySelectorAll('.side-song-item').forEach(el => {
        el.addEventListener('click', () => playTrack(Number(el.dataset.idx)));
      });
    }

    const libSub = document.getElementById('lib-sub');
    if(libSub){
      if(currentView === 'home') libSub.textContent = 'Made for you';
      else if(currentView === 'new') libSub.textContent = drafts.length ? (drafts.length + (drafts.length===1 ? ' new release' : ' new releases')) : '';
      else if(currentView === 'radio') libSub.textContent = 'Live and upcoming shows';
      else if(currentView === 'search') libSub.textContent = 'Discover by artist, song, or lyric';
      else libSub.textContent = drafts.length ? (drafts.length + (drafts.length===1 ? ' song' : ' songs')) : '';
    }

    const body = document.getElementById('library-body');

    if(currentView === 'songs'){
      const songs = [...filtered];
      if(songsSort === 'title') songs.sort((a,b) => (a.title||'').localeCompare(b.title||''));
      if(songsSort === 'artist') songs.sort((a,b) => (a.artist||'').localeCompare(b.artist||''));
      if(songsSort === 'recent') songs.sort((a,b) => (b.updated||0) - (a.updated||0));
      body.innerHTML =
        '<div class="songs-toolbar">' +
          '<div class="songs-toolbar-left">' +
            '<button class="songs-ctl-btn" id="songs-play-all" type="button">Play</button>' +
            '<button class="songs-ctl-btn" id="songs-shuffle" type="button">Shuffle</button>' +
          '</div>' +
          '<div class="songs-toolbar-right">' +
            '<span style="font-size:11px; color: var(--text-faint);">Sort</span>' +
            '<select class="songs-select" id="songs-sort">' +
              '<option value="recent">Recently Added</option>' +
              '<option value="title">Title</option>' +
              '<option value="artist">Artist</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="songs-table-wrap">' +
          '<table class="songs-table">' +
            '<thead><tr><th class="songs-fav-col">Favorited</th><th>Name</th><th>Artist</th><th>Album</th><th class="songs-time-col">Time</th></tr></thead>' +
            '<tbody>' + songs.map((d, i) => {
              const idx = drafts.indexOf(d);
              const loaded = sessionAudio.draftId === d.id;
              const dur = loaded && sessionAudio.el && sessionAudio.el.duration ? fmtTime(sessionAudio.el.duration) : '--:--';
              const fav = !!favoriteMap[d.id || idx];
              const album = d.album || ((d.title || 'Untitled') + ' - Single');
              return '<tr' + (idx===currentIdx ? ' class="playing"' : '') + ' data-idx="' + idx + '">' +
                '<td>' +
                  '<button class="row-action-btn' + (fav ? ' active' : '') + '" data-fav="' + idx + '" title="Favourite">' +
                    '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12.1 20.3 4.9 13.1a4.9 4.9 0 0 1 6.9-6.9l.2.2.2-.2a4.9 4.9 0 0 1 6.9 6.9l-7.2 7.2a.6.6 0 0 1-.8 0Z"/></svg>' +
                  '</button>' +
                '</td>' +
                '<td>' +
                  '<div class="song-name-cell">' +
                    '<div class="row-cover-wrap">' +
                      (d.cover ? '<img class="row-cover" src="' + d.cover + '">' : '<div class="row-cover"></div>') +
                      '<div class="row-hover-play"><svg viewBox="0 0 24 24"><path d="M8,5V19L19,12Z"/></svg></div>' +
                      '<div class="row-eq"><span></span><span></span><span></span></div>' +
                    '</div>' +
                    '<span>' + escapeHtml(d.title || 'Untitled') + '</span>' +
                    '<button class="song-name-play" data-play-row="' + idx + '" title="Play"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M8,5V19L19,12Z"/></svg></button>' +
                  '</div>' +
                '</td>' +
                '<td>' + escapeHtml(d.artist || 'Unknown Artist') + '</td>' +
                '<td>' + escapeHtml(album) + '</td>' +
                '<td class="songs-time-col">' + dur + '</td>' +
              '</tr>';
            }).join('') + '</tbody>' +
          '</table>' +
        '</div>';
      const sortEl = document.getElementById('songs-sort');
      if(sortEl){
        sortEl.value = songsSort;
        sortEl.addEventListener('change', (e) => {
          songsSort = e.target.value;
          renderSongLists();
        });
      }
      const playAllBtn = document.getElementById('songs-play-all');
      if(playAllBtn){
        playAllBtn.addEventListener('click', () => { if(songs.length) playTrack(drafts.indexOf(songs[0])); });
      }
      const shuffleBtn = document.getElementById('songs-shuffle');
      if(shuffleBtn){
        shuffleBtn.addEventListener('click', () => {
          if(!songs.length) return;
          const random = songs[Math.floor(Math.random() * songs.length)];
          playTrack(drafts.indexOf(random));
        });
      }
      body.querySelectorAll('tr[data-idx]').forEach(row => {
        row.addEventListener('click', () => playTrack(Number(row.dataset.idx)));
      });
      body.querySelectorAll('[data-play-row]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playTrack(Number(btn.dataset.playRow));
        });
      });
      body.querySelectorAll('[data-fav]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.fav);
          const d = drafts[idx];
          const key = d.id || idx;
          favoriteMap[key] = !favoriteMap[key];
          renderSongLists();
        });
      });
      body.querySelectorAll('[data-more]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.more);
          playTrack(idx);
        });
      });
      return;
    }

    if(currentView === 'artists'){
      body.innerHTML = '<div class="am-section"><div class="am-section-header"><div class="am-section-title">Artists</div></div><div class="shelf-grid">' +
        filtered.map(d => '<div class="shelf-card" data-shelf-open="' + drafts.indexOf(d) + '"><div class="shelf-title">' + escapeHtml(d.artist || 'Unknown Artist') + '</div><div class="shelf-sub">Artist</div></div>').join('') +
      '</div></div>';
      body.querySelectorAll('[data-shelf-open]').forEach(el => el.addEventListener('click', () => playTrack(Number(el.dataset.shelfOpen))));
      return;
    }

    if(currentView === 'albums'){
      body.innerHTML = '<div class="am-section"><div class="am-section-header"><div class="am-section-title">Albums</div></div><div class="shelf-grid">' +
        filtered.map(d => '<div class="shelf-card" data-shelf-open="' + drafts.indexOf(d) + '"><div class="shelf-title">' + escapeHtml(d.title || 'Untitled') + '</div><div class="shelf-sub">Album</div></div>').join('') +
      '</div></div>';
      body.querySelectorAll('[data-shelf-open]').forEach(el => el.addEventListener('click', () => playTrack(Number(el.dataset.shelfOpen))));
      return;
    }

    if(currentView === 'videos'){
      body.innerHTML = '<div class="am-section"><div class="am-section-header"><div class="am-section-title">Music Videos</div></div><div class="am-grid">' +
        filtered.map(d => '<div class="am-card" data-idx="' + drafts.indexOf(d) + '"><img class="am-card-cover" src="' + (d.cover || '') + '"><div class="am-card-title">' + escapeHtml(d.title || 'Untitled') + '</div><div class="am-card-artist">Music Video</div></div>').join('') +
      '</div></div>';
      body.querySelectorAll('.am-card[data-idx]').forEach(el => el.addEventListener('click', () => playTrack(Number(el.dataset.idx))));
      return;
    }

    if(currentView === 'search'){
      body.innerHTML =
        '<div class="am-search-wrap">' +
          '<input class="am-search-input" id="main-search-input" placeholder="Artists, Songs, Lyrics" value="' + escapeHtml(searchQuery) + '">' +
          '<div class="am-chip-row">' +
            '<div class="am-chip">Pop</div><div class="am-chip">R&B</div><div class="am-chip">Hip-Hop</div><div class="am-chip">Dance</div><div class="am-chip">Afrobeats</div><div class="am-chip">Electronic</div>' +
          '</div>' +
        '</div>';
      const searchInput = document.getElementById('main-search-input');
      if(searchInput){
        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value || '';
          renderSongLists();
        });
        searchInput.focus();
      }
      if(searchQuery.trim()){
        if(!filtered.length){
          body.innerHTML += '<div id="empty-library">No songs match your search.</div>';
        } else {
          body.innerHTML +=
            '<div class="am-section"><div class="am-section-header"><div class="am-section-title">Top Results</div></div>' +
            '<div class="am-grid">' + filtered.map(d => {
              const idx = drafts.indexOf(d);
              return '<div class="am-card" data-idx="' + idx + '">' +
                '<img class="am-card-cover" src="' + (d.cover || 'data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Crect%20fill%3D%22%230d0d10%22%20width%3D%22100%25%22%20height%3D%22100%25%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%20font-size%3D%2264%22%3E%E2%99%AA%3C%2Ftext%3E%3C%2Fsvg%3E') + '">' +
                '<div class="am-card-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
                '<div class="am-card-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div>' +
              '</div>';
            }).join('') + '</div></div>';
          body.querySelectorAll('.am-card[data-idx]').forEach(card => {
            card.addEventListener('click', () => playTrack(Number(card.dataset.idx)));
          });
        }
      }
      return;
    }

    if(currentView === 'radio'){
      const stations = ['Apple Music 1', 'Apple Music Hits', 'Apple Music Country', 'Apple Music Chill', 'Apple Musica Uno'];
      body.innerHTML =
        '<div class="am-section"><div class="am-section-header"><div class="am-section-title">On Air Now</div></div>' +
        '<div class="radio-list">' + stations.map((name, i) => {
          const idx = drafts.length ? (i % drafts.length) : -1;
          return '<div class="radio-card"' + (idx >= 0 ? ' data-radio-play="' + idx + '"' : '') + '><div class="radio-title">' + escapeHtml(name) + '</div><div class="radio-sub">Live station</div></div>';
        }).join('') + '</div></div>' +
        '<div class="am-section"><div class="am-section-header"><div class="am-section-title">Artists Take Over</div></div>' +
        '<div class="am-grid">' + drafts.map(d => {
          const idx = drafts.indexOf(d);
          return '<div class="am-card" data-idx="' + idx + '"><img class="am-card-cover" src="' + (d.cover || '') + '"><div class="am-card-title">' + escapeHtml(d.title || 'Untitled') + '</div><div class="am-card-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div></div>';
        }).join('') + '</div></div>';
      body.querySelectorAll('[data-radio-play]').forEach(el => {
        el.addEventListener('click', () => playTrack(Number(el.dataset.radioPlay)));
      });
      body.querySelectorAll('.am-card[data-idx]').forEach(el => {
        el.addEventListener('click', () => playTrack(Number(el.dataset.idx)));
      });
      return;
    }

    if(currentView === 'home'){
      if(!drafts.length){
        body.innerHTML = '<div id="empty-library">No drafts to preview yet. Write and save a draft in the studio, then reopen this emulator from the <b>admin panel</b> to see it here as a track.</div>';
        return;
      }
      const picks = filtered.slice(0, 4);
      const madeForYou = filtered.slice().reverse().slice(0, 4);
      body.innerHTML =
        '<div class="home-intro">Home<br><span>Recently played, made for you, and fresh picks from your library.</span></div>' +
        '<div class="am-section">' +
          '<div class="am-section-header"><div class="am-section-title">Top Picks</div></div>' +
          '<div class="am-grid">' + picks.map((d) => {
            const idx = drafts.indexOf(d);
            return '<div class="am-card" data-idx="' + idx + '">' +
              '<img class="am-card-cover" src="' + (d.cover || '') + '" alt="">' +
              '<div class="am-card-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
              '<div class="am-card-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div>' +
            '</div>';

  // ---------- playback ----------
  function playTrack(idx){
    if(idx < 0 || idx >= drafts.length) return;
    currentIdx = idx;
    const d = drafts[currentIdx];

    const mp = document.getElementById('mini-player');
    if(!mp.classList.contains('visible')){
      mp.classList.add('visible');
      void mp.offsetHeight; // force reflow so has-track's transform actually transitions in
      requestAnimationFrame(() => mp.classList.add('has-track'));
    }
    const miniCover = document.getElementById('mini-cover');
    miniCover.style.opacity = '0';
    setTimeout(() => {
      miniCover.src = d.cover || '';
      miniCover.style.visibility = d.cover ? 'visible' : 'hidden';
      miniCover.style.opacity = '1';
    }, 140);
    document.getElementById('mini-title').textContent = d.title || 'Untitled';
    document.getElementById('mini-artist').textContent = d.artist || 'Unknown Artist';

    if(sessionAudio.el){
      sessionAudio.el.pause();
      if(sessionAudio.url) URL.revokeObjectURL(sessionAudio.url);
    }
    sessionAudio = { draftId: null, url: null, el: null };

    renderSongLists();
    renderNowPlayingInfo();
    renderLyrics();
    refreshTransportUI();
  }

  function renderNowPlayingInfo(){
    const d = getActive();
    if(!d) return;
    const titleEl = document.getElementById('np-title');
    const artistEl = document.getElementById('np-artist');
    const cover = document.getElementById('np-cover');
    const placeholder = document.getElementById('np-cover-placeholder');
    const backdrop = document.getElementById('np-backdrop');

    // fade the outgoing art/text out, swap content, fade back in — avoids the
    // jarring instant pop when skipping tracks
    [titleEl, artistEl, cover, placeholder, backdrop].forEach(el => el.style.opacity = '0');
    setTimeout(() => {
      titleEl.textContent = d.title || 'Untitled';
      artistEl.textContent = d.artist || 'Unknown Artist';
      if(d.cover){
        cover.src = d.cover; cover.style.display = 'block'; placeholder.style.display = 'none';
        backdrop.style.backgroundImage = 'url(' + d.cover + ')'; backdrop.classList.add('has-cover');
      } else {
        cover.style.display = 'none'; placeholder.style.display = 'flex';
        backdrop.classList.remove('has-cover');
      }
      requestAnimationFrame(() => {
        titleEl.style.opacity = '1'; artistEl.style.opacity = '1';
        cover.style.opacity = '1'; placeholder.style.opacity = '1';
        backdrop.style.opacity = backdrop.classList.contains('has-cover') ? '0.9' : '0';
      });
    }, 160);
    renderQueuePanel();
  }

  function renderQueuePanel(){
    const panel = document.getElementById('np-queue-panel');
    if(!drafts.length){ panel.innerHTML = '<div id="np-no-lyrics">Nothing queued.</div>'; return; }
    panel.innerHTML = drafts.map((d, i) => {
      return '<div class="np-queue-row' + (i===currentIdx ? ' current' : '') + '" data-idx="' + i + '">' +
        (d.cover ? '<img class="np-queue-cover" src="' + d.cover + '">' : '<div class="np-queue-cover"></div>') +
        '<div><div class="np-queue-title">' + escapeHtml(d.title || 'Untitled') + '</div>' +
        '<div class="np-queue-artist">' + escapeHtml(d.artist || 'Unknown Artist') + '</div></div>' +
      '</div>';
    }).join('');
    panel.querySelectorAll('.np-queue-row').forEach(el => {
      el.addEventListener('click', () => playTrack(Number(el.dataset.idx)));
    });
  }

  function renderLyrics(){
    const d = getActive();
    const content = document.getElementById('np-lyrics-content');
    const banner = document.getElementById('load-audio-banner');
    if(!d){ content.innerHTML = ''; banner.classList.remove('show'); return; }
    const lyrics = d.lyrics || '';
    const hasSyncData = d.syncedTimes && Object.keys(d.syncedTimes).length > 0;
    const loaded = sessionAudio.draftId === d.id;

    banner.classList.toggle('show', !loaded);
    document.getElementById('load-audio-text').textContent = hasSyncData
      ? "This track has synced lyrics — load its audio to hear it play back karaoke-style."
      : "Load this track's audio to enable playback.";

    if(!lyrics.trim()){
      content.innerHTML = '<div id="np-no-lyrics">No lyrics written for this draft yet.</div>';
      return;
    }
    content.innerHTML = buildLyricsHtml(lyrics);
    content.querySelectorAll('.np-lyric-line[data-idx]').forEach(el => {
      el.addEventListener('click', () => {
        if(!loaded || !sessionAudio.el) return;
        const t = normTime(d.syncedTimes && d.syncedTimes[el.dataset.idx]);
        if(t) sessionAudio.el.currentTime = t.start;
      });
    });
    syncPrevActiveIdx = null;
  }

  // ---------- session audio loading (per-track, not persisted — mirrors the
  // main app's design where raw audio blobs never touch localStorage) ----------
  function loadAudioForCurrent(file){
    const d = getActive();
    if(!d || !file) return;
    if(sessionAudio.url) URL.revokeObjectURL(sessionAudio.url);
    const url = URL.createObjectURL(file);
    const el = new Audio(url);
    el.preload = 'metadata';
    sessionAudio = { draftId: d.id, url, el };
    wireAudioElement(el);
    el.addEventListener('loadedmetadata', () => { renderSongLists(); refreshTransportUI(); });
    document.getElementById('load-audio-banner').classList.remove('show');
  }

  function wireAudioElement(el){
    el.volume = Number(document.getElementById('mini-volume').value || 0.9);
    el.addEventListener('play', () => { refreshTransportUI(); startSmoothLoop(); });
    el.addEventListener('pause', () => { refreshTransportUI(); updateSyncHighlight(); stopSmoothLoop(); });
    el.addEventListener('seeked', () => { refreshTransportUI(); updateSyncHighlight(); });
    el.addEventListener('ended', () => { stopSmoothLoop(); nextTrack(true); });
  }

  // Karaoke-style word/line highlighting needs to sweep continuously, not in the
  // ~4-times-a-second steps that the audio element's 'timeupdate' event fires at
  // — that stepping is what made the sync look choppy instead of smooth like
  // Apple Music's actual lyrics view. Runs every animation frame only while a
  // track is actually playing, and stops itself the instant it's paused.
  let smoothLoopHandle = null;
  function startSmoothLoop(){
    if(smoothLoopHandle) return;
    const tick = () => {
      const el = sessionAudio.el;
      if(!el || el.paused){ smoothLoopHandle = null; return; }
      refreshTransportUI();
      updateSyncHighlight();
      smoothLoopHandle = requestAnimationFrame(tick);
    };
    smoothLoopHandle = requestAnimationFrame(tick);
  }
  function stopSmoothLoop(){
    if(smoothLoopHandle){ cancelAnimationFrame(smoothLoopHandle); smoothLoopHandle = null; }
  }

  document.getElementById('load-audio-btn').addEventListener('click', () => {
    document.getElementById('load-audio-input').click();
  });
  document.getElementById('load-audio-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) loadAudioForCurrent(file);
    e.target.value = '';
  });

  // ---------- transport UI (mini bar + fullscreen bar share the same audio state) ----------
  function refreshTransportUI(){
    const el = sessionAudio.el;
    const pct = (el && el.duration) ? (el.currentTime/el.duration)*100 : 0;
    const elapsed = el ? fmtTime(el.currentTime) : '0:00';
    const remaining = el ? '-' + fmtTime((el.duration||0) - el.currentTime) : '-0:00';
    const playing = el && !el.paused;
    const playIcon = playing
      ? '<path d="M6,5H10V19H6ZM14,5H18V19H14Z"/>'
      : '<path d="M8,5V19L19,12Z"/>';

    document.getElementById('mini-scrub-fill').style.width = pct + '%';
    document.getElementById('mini-scrub-dot').style.left = pct + '%';
    document.getElementById('mini-time-elapsed').textContent = elapsed;
    document.getElementById('mini-time-remaining').textContent = remaining;
    document.getElementById('mini-play-icon').innerHTML = playIcon;

    document.getElementById('np-scrub-fill').style.width = pct + '%';
    document.getElementById('np-scrub-dot').style.left = pct + '%';
    document.getElementById('np-time-elapsed').textContent = elapsed;
    document.getElementById('np-time-remaining').textContent = remaining;
    document.getElementById('np-play-icon').innerHTML = playIcon;

    const playingRow = document.querySelector('table.song-table tr.playing');
    if(playingRow) playingRow.classList.toggle('row-paused', !playing);
  }

  function togglePlay(){
    const el = sessionAudio.el;
    if(!el) return;
    if(el.paused) el.play(); else el.pause();
  }
  function restart(){
    const el = sessionAudio.el;
    if(!el) return;
    el.currentTime = 0;
    el.play();
  }
  function seekForward(){
    const el = sessionAudio.el;
    if(!el) return;
    el.currentTime = Math.min(el.duration || Infinity, el.currentTime + 10);
    refreshTransportUI();
  }
  function nextTrack(auto){
    if(!drafts.length) return;
    if(repeatMode === 'one' && currentIdx >= 0 && sessionAudio.el){
      sessionAudio.el.currentTime = 0;
      sessionAudio.el.play();
      return;
    }
    let next = currentIdx + 1;
    if(shuffleOn && drafts.length > 1){
      do {
        next = Math.floor(Math.random() * drafts.length);
      } while(next === currentIdx);
    } else if(next >= drafts.length) {
      if(repeatMode === 'all' || auto) next = 0;
      else next = drafts.length - 1;
    }
    playTrack(next);
    if(auto){ /* auto-advance leaves playback paused since new track has no audio loaded yet */ }
  }
  function prevTrack(){
    if(!drafts.length) return;
    const prev = (currentIdx - 1 + drafts.length) % drafts.length;
    playTrack(prev);
  }

  function seekFromTrack(track, clientX){
    const el = sessionAudio.el;
    if(!el || !el.duration) return;
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    el.currentTime = frac * el.duration;
    refreshTransportUI();
  }
  function wireScrubTrack(trackEl){
    let scrubbing = false;
    trackEl.addEventListener('pointerdown', e => { scrubbing = true; trackEl.setPointerCapture(e.pointerId); seekFromTrack(trackEl, e.clientX); });
    trackEl.addEventListener('pointermove', e => { if(scrubbing) seekFromTrack(trackEl, e.clientX); });
    trackEl.addEventListener('pointerup', () => { scrubbing = false; });
  }
  wireScrubTrack(document.getElementById('mini-scrub-track'));
  wireScrubTrack(document.getElementById('np-scrub-track'));

  document.getElementById('mini-play').addEventListener('click', togglePlay);
  document.getElementById('np-play').addEventListener('click', togglePlay);
  document.getElementById('np-prev').addEventListener('click', prevTrack);
  document.getElementById('np-next').addEventListener('click', () => nextTrack(false));
  document.getElementById('mini-next').addEventListener('click', () => nextTrack(false));
  document.getElementById('mini-prev').addEventListener('click', prevTrack);
  document.getElementById('mini-volume').addEventListener('input', (e) => {
    if(sessionAudio.el) sessionAudio.el.volume = Number(e.target.value);
  });

  // ---------- karaoke highlight (line + word), same behavior as the main app ----------
  function updateSyncHighlight(){
    const d = getActive();
    if(!d || !d.syncedTimes || !sessionAudio.el) return;
    const t = sessionAudio.el.currentTime;
    const entries = Object.entries(d.syncedTimes)
      .map(([idx,time]) => ({ idx, time: normTime(time) }))
      .sort((a,b) => a.time.start - b.time.start);
    let activeIdx = null;
    entries.forEach(e => { if(e.time.start <= t) activeIdx = e.idx; });

    if(activeIdx !== syncPrevActiveIdx){
      syncPrevActiveIdx = activeIdx;
      document.querySelectorAll('#np-lyrics-content .np-lyric-line[data-idx]').forEach(el => {
        el.classList.toggle('active-sync', el.dataset.idx === activeIdx);
      });
      document.querySelectorAll('#np-lyrics-content .np-line-fill').forEach(el => el.remove());
      if(activeIdx !== null){
        const activeEl = document.querySelector('#np-lyrics-content .np-lyric-line[data-idx="' + activeIdx + '"]');
        if(activeEl) activeEl.scrollIntoView({ block:'center', behavior:'smooth' });
      }
    }

    if(activeIdx === null) return;
    const lineHasWordSync = !!(d.syncedWords && Object.keys(d.syncedWords).some(k => k.split(':')[0] === String(activeIdx)));
    if(lineHasWordSync){
      document.querySelectorAll('#np-lyrics-content .np-lyric-line[data-idx="' + activeIdx + '"] .np-word').forEach(wEl => {
        const key = wordKey(activeIdx, wEl.dataset.wordIdx);
        const wt = d.syncedWords[key];
        wEl.classList.toggle('active-word', !!wt && t >= wt.start && t < wt.end);
        wEl.classList.toggle('sung-word', !!wt && t >= wt.end);
      });
    } else {
      const lineEl = document.querySelector('#np-lyrics-content .np-lyric-line[data-idx="' + activeIdx + '"]');
      if(lineEl){
        const curPos = entries.findIndex(e => e.idx === activeIdx);
        const lineStart = entries[curPos].time.start;
        const nextEntry = entries[curPos + 1];
        const lineEnd = nextEntry ? nextEntry.time.start : (sessionAudio.el.duration || lineStart + 4);
        const progress = lineEnd > lineStart ? Math.min(1, Math.max(0, (t - lineStart) / (lineEnd - lineStart))) : 1;
        let fill = lineEl.querySelector('.np-line-fill');
        if(!fill){
          fill = document.createElement('span');
          fill.className = 'np-line-fill';
          fill.setAttribute('aria-hidden', 'true');
          fill.innerHTML = lineEl.innerHTML;
          lineEl.appendChild(fill);
        }
        fill.style.setProperty('--wipe', (progress * 100) + '%');
      }
    }
  }

  // ---------- fullscreen now-playing open/close + tabs ----------
  // display:none can't be transitioned, so opening needs two steps: make it
  // display:flex (still visually at its closed transform/opacity), force a
  // reflow, then add the class that animates it to open — otherwise the browser
  // collapses the "closed → open" change into a single frame and nothing slides.
  function openFullscreen(){
    if(!getActive()) return;
    const el = document.getElementById('fullscreen-np');
    el.classList.add('visible');
    void el.offsetHeight; // force reflow so the next class change transitions
    el.classList.add('open');
  }
  function closeFullscreen(){
    const el = document.getElementById('fullscreen-np');
    el.classList.remove('open');
    setTimeout(() => { if(!el.classList.contains('open')) el.classList.remove('visible'); }, 450);
  }
  document.getElementById('mini-expand').addEventListener('click', openFullscreen);
  document.getElementById('mini-cover').addEventListener('click', openFullscreen);
  document.getElementById('np-close').addEventListener('click', closeFullscreen);
  document.getElementById('np-scrim').addEventListener('click', closeFullscreen);

  function setTab(tab){
    const root = document.getElementById('fullscreen-np');
    const shouldShowQueue = tab === 'queue';
    if(tab === npTab && root.classList.contains('tab-queue') === shouldShowQueue){
      return;
    }
    npTab = tab;
    const lyricsPanel = document.getElementById('np-lyrics-panel');
    const queuePanel = document.getElementById('np-queue-panel');
    const showingQueue = tab === 'queue';
    const outgoing = showingQueue ? lyricsPanel : queuePanel;
    const incoming = showingQueue ? queuePanel : lyricsPanel;
    // crossfade: fade the outgoing panel out, prime the incoming one at opacity 0
    // (harmless while it's still display:none), swap which one is in the flow,
    // then fade the incoming one in — instead of an instant display swap
    outgoing.style.opacity = '0';
    incoming.style.opacity = '0';
    root.classList.toggle('tab-queue', showingQueue);
    setTimeout(() => {
      requestAnimationFrame(() => { incoming.style.opacity = '1'; });
    }, 140);
    document.getElementById('np-tab-lyrics').classList.toggle('active', tab === 'lyrics');
    document.getElementById('np-tab-queue').classList.toggle('active', tab === 'queue');
    const lyricsUtil = document.getElementById('np-util-lyrics');
    const queueUtil = document.getElementById('np-util-queue');
    if(lyricsUtil) lyricsUtil.classList.toggle('active', tab === 'lyrics');
    if(queueUtil) queueUtil.classList.toggle('active', tab === 'queue');
  }

      });
    }
    const openInMusicBtn = document.getElementById('open-in-music-btn');
    if(openInMusicBtn){
      openInMusicBtn.addEventListener('click', () => {
        window.open('https://music.apple.com/', '_blank');
      });
    }
    const signInBtn = document.getElementById('sign-in-btn');
    if(signInBtn){
      signInBtn.addEventListener('click', () => {
        window.open('https://music.apple.com/account/settings', '_blank');
      });
    }
    const libraryEditBtn = document.getElementById('library-edit-btn');
    if(libraryEditBtn){
      libraryEditBtn.addEventListener('click', () => {
        setView('songs');
      });
    }
  }

  function wireUtilityButtons(){
    const lyricsBtn = document.getElementById('np-util-lyrics');
    const queueBtn = document.getElementById('np-util-queue');
    const shuffleBtn = document.getElementById('np-shuffle');
    const repeatBtn = document.getElementById('np-repeat');
    if(lyricsBtn) lyricsBtn.addEventListener('click', () => setTab('lyrics'));
    if(queueBtn) queueBtn.addEventListener('click', () => setTab('queue'));
    if(shuffleBtn) shuffleBtn.addEventListener('click', () => {
      shuffleOn = !shuffleOn;
      shuffleBtn.classList.toggle('active', shuffleOn);
    });
    if(repeatBtn) repeatBtn.addEventListener('click', () => {
      repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
      repeatBtn.classList.toggle('active', repeatMode !== 'off');
      repeatBtn.title = repeatMode === 'off' ? 'Repeat off' : (repeatMode === 'all' ? 'Repeat all' : 'Repeat one');
    });
    const miniLyricsBtn = document.getElementById('mini-open-lyrics');
    const miniQueueBtn = document.getElementById('mini-open-queue');
    if(miniLyricsBtn) miniLyricsBtn.addEventListener('click', () => { openFullscreen(); setTab('lyrics'); });
    if(miniQueueBtn) miniQueueBtn.addEventListener('click', () => { openFullscreen(); setTab('queue'); });
  }
  document.getElementById('np-tab-lyrics').addEventListener('click', () => setTab('lyrics'));
  document.getElementById('np-tab-queue').addEventListener('click', () => setTab('queue'));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.getElementById('fullscreen-np').classList.contains('open')){
      closeFullscreen();
    }
    if(e.key === ' ' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault();
      togglePlay();
    }
  });

  // ---------- boot ----------
  wireShellNav();
  wireUtilityButtons();
  renderSongLists();
  if(currentIdx >= 0){
    renderNowPlayingInfo();
    renderLyrics();
  } else {
    document.getElementById('np-title').textContent = '';
    document.getElementById('np-artist').textContent = '';
  }
</script>
</body>
</html>
