<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify — Drafts Preview</title>
<script>
  (function(){
    try{
      const granted = localStorage.getItem('emulator_access') === 'true';
      window.__SEMULATOR_OWNER__ = granted;
    }catch(e){
      window.__SEMULATOR_OWNER__ = false;
    }
  })();
</script>
<style>
  :root{
    --font-spotify: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --bg: #0a0a0a;
    --bg-2: #101010;
    --panel: rgba(255,255,255,0.06);
    --panel-2: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f5;
    --text-dim: rgba(245,245,245,0.72);
    --text-faint: rgba(245,245,245,0.48);
    --accent: #1ed760;
    --accent-2: #17c25a;
    --danger: #ff4e6a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: var(--font-spotify);
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(30,215,96,0.18), transparent 20%),
      radial-gradient(circle at top right, rgba(255,255,255,0.04), transparent 24%),
      linear-gradient(180deg, #101010, #070707);
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input{ font: inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.18); border-radius:5px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  #app{ display:flex; flex-direction:column; min-height:100%; }
  body.public-mode{ overflow:auto; }
  body.public-mode #app{ display:block; min-height:100%; }
  body.public-mode #topbar,
  body.public-mode #sidebar{ display:none; }
  body.public-mode #content{
    padding: 28px 18px 48px;
    background:
      radial-gradient(circle at top left, rgba(30,215,96,0.12), transparent 22%),
      linear-gradient(180deg, #0a0a0a, #080808);
  }
  #topbar{
    height:64px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; background: rgba(0,0,0,0.55); border-bottom:1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-0.3px; }
  .brand-badge{
    width:30px; height:30px; border-radius:8px;
    display:grid; place-items:center; font-size:14px;
    background: linear-gradient(135deg, #2ce78b, #1ed760);
    color:#03150a; box-shadow: 0 10px 24px rgba(30,215,96,0.34);
  }
  .brand span{ font-size:14px; }
  .top-actions{ display:flex; gap:10px; align-items:center; }
  .pill{
    border:1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color:var(--text-dim);
    border-radius:999px; padding:8px 12px; font-size:12px; font-weight:700;
  }
  .pill.accent{ color:#03150a; background: var(--accent); border-color: transparent; }

  #main-row{ flex:1; display:flex; min-height:0; }
  #sidebar{
    width:280px; flex-shrink:0; background: rgba(255,255,255,0.03); border-right:1px solid rgba(255,255,255,0.06);
    padding:16px 12px 12px; display:flex; flex-direction:column; gap:10px;
  }

  @media (max-width: 820px){
    body{ overflow:auto; }
    #topbar{ height:auto; padding:12px 14px; align-items:flex-start; gap:10px; flex-direction:column; }
    #main-row{ flex-direction:column; }
    #sidebar{ width:auto; border-right:none; border-bottom:1px solid rgba(255,255,255,0.06); }
    #content{ padding:16px; }
    .hero{ grid-template-columns:1fr; padding:16px; }
    .hero h1{ font-size:24px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
  }

  @media (max-width: 560px){
    .top-actions{ width:100%; flex-wrap:wrap; }
    .grid{ grid-template-columns:1fr; }
    .card{ padding:12px; }
    .side-track{ padding:8px; }
    .lyrics-only-card{ padding:16px; }
    .lyrics-only-title{ font-size:24px; }
    .lyrics-line{ font-size:13px; }
  }
  .nav-btn{
    width:100%; text-align:left; border:none; background:transparent; color:var(--text-dim);
    border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:700; font-size:13px;
    display:flex; align-items:center; gap:10px;
  }
  .nav-btn.active{ background: rgba(30,215,96,0.16); color:#fff; }
  .nav-btn:hover{ background: rgba(255,255,255,0.05); color:#fff; }
  .nav-btn svg{ width:16px; height:16px; fill:currentColor; }
  .side-title{ color:var(--text-faint); font-size:11px; font-weight:800; letter-spacing:0.4px; text-transform:uppercase; padding:4px 10px; }
  .side-list{ flex:1; overflow:auto; display:flex; flex-direction:column; gap:4px; }
  .side-track{
    display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:10px; cursor:pointer;
    transition: background .15s ease;
  }
  .side-track:hover{ background: rgba(255,255,255,0.06); }
  .side-track.active{ background: rgba(30,215,96,0.16); }
  .side-cover{
    width:34px; height:34px; border-radius:7px; object-fit:cover; background: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .side-track-title{ font-size:12.6px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-track-artist{ font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #content{
    flex:1; min-width:0; overflow:auto; padding:26px 28px 42px;
    background:
      radial-gradient(circle at top left, rgba(30,215,96,0.12), transparent 24%),
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 130px),
      linear-gradient(180deg, #0a0a0a, #080808);
  }
  .hero{
    display:grid; grid-template-columns: 1.2fr 0.8fr; gap:18px;
    padding:20px; margin-bottom:20px; border-radius:24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.08);
  }
  .hero h1{ font-size:30px; font-weight:900; letter-spacing:-0.65px; margin-bottom:8px; }
  .hero p{ color:var(--text-dim); font-size:13px; line-height:1.7; max-width:580px; }
  .hero-stats{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .stat{ padding:14px; border-radius:16px; background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); }
  .stat-label{ font-size:11px; text-transform:uppercase; color:var(--text-faint); letter-spacing:0.4px; }
  .stat-value{ font-size:22px; font-weight:800; margin-top:6px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap:14px; }
  .card{
    padding:14px; border-radius:18px; cursor:pointer; background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.025));
    border:1px solid rgba(255,255,255,0.07); transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card:hover{ transform: translateY(-2px); border-color: rgba(30,215,96,0.36); }
  .card.cover{ padding:0; overflow:hidden; }
  .card-cover{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background: rgba(255,255,255,0.05); }
  .card-body{ padding:14px; }
  .card-title{ font-size:14px; font-weight:800; }
  .card-artist{ color:var(--text-faint); font-size:12px; margin-top:2px; }
  .card-meta{ display:flex; justify-content:space-between; align-items:center; color:var(--text-faint); font-size:11px; margin-top:8px; }
  .badge{ padding:2px 7px; border-radius:999px; background: rgba(255,255,255,0.06); }

  .lyrics-only-wrap{ max-width:900px; padding-top:6px; }
  .lyrics-only-card{
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
    border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .lyrics-only-title{ font-size:28px; font-weight:900; letter-spacing:-0.5px; margin-bottom:4px; }
  .lyrics-only-artist{ color:var(--text-dim); font-size:13px; margin-bottom:16px; }
  .lyrics-line{ font-size:14px; line-height:1.8; color:var(--text-dim); }
  .lyrics-line.section{ margin-top:18px; font-weight:800; color:var(--text); }
  .lyrics-empty{ color:var(--text-faint); padding:12px 0; }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="brand"><div class="brand-badge">♫</div><span>Spotify Drafts Emulator</span></div>
      <div class="top-actions">
        <div class="pill">Owner-only demo access</div>
        <div class="pill accent" id="access-pill">Lyrics-only mode</div>
      </div>
    </div>
    <div id="main-row">
      <aside id="sidebar">
        <button class="nav-btn active"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"></path></svg>Overview</button>
        <button class="nav-btn"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 15h-2v-6h2Zm0-8h-2V7h2Z"></path></svg>Library</button>
        <div class="side-title">Drafts</div>
        <div class="side-list" id="side-list"></div>
      </aside>
      <main id="content"></main>
    </div>
  </div>
<script>
  const STORAGE_KEY = 'manuscript_lyric_drafts_v1';
  const owner = !!window.__SEMULATOR_OWNER__;
  const content = document.getElementById('content');
  const sideList = document.getElementById('side-list');
  const accessPill = document.getElementById('access-pill');

  function safeGetDrafts(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }

  function escapeHtml(text){
    return String(text || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function wordCount(text){
    const words = (text || '').trim().match(/\S+/g);
    return words ? words.length : 0;
  }

  function buildPublicLyrics(d){
    const lyrics = d.lyrics || '';
    if(!lyrics.trim()){
      return '<div class="lyrics-empty">No lyrics written for this draft yet.</div>';
    }
    const lines = lyrics.split('\n');
    const sections = [];
    lines.forEach(line=>{
      const trimmed = line.trim();
      if(!trimmed) return;
      if(/^\[[^\]]+\]$/.test(trimmed)){
        sections.push('<div class="lyrics-line section">' + escapeHtml(trimmed) + '</div>');
      } else {
        sections.push('<div class="lyrics-line">' + escapeHtml(trimmed) + '</div>');
      }
    });
    return sections.join('');
  }

  function buildOwnerView(drafts){
    const totalWords = drafts.reduce((sum, d)=>sum + wordCount(d.lyrics || ''), 0);
    const synced = drafts.filter(d=>d.syncedTimes && Object.keys(d.syncedTimes).length).length;

    const hero = `
      <section class="hero">
        <div>
          <h1>Apple-style lyric drafts, now in Spotify shell</h1>
          <p>Owner/admin view: this page treats drafts like a full music website—browse, scan the library, and preview each manuscript in a polished Spotify-inspired UI. Public viewers get only the lyric content, not the site chrome.</p>
        </div>
        <div class="hero-stats">
          <div class="stat"><div class="stat-label">Drafts</div><div class="stat-value">${drafts.length}</div></div>
          <div class="stat"><div class="stat-label">Words</div><div class="stat-value">${totalWords}</div></div>
          <div class="stat"><div class="stat-label">Synced</div><div class="stat-value">${synced}</div></div>
          <div class="stat"><div class="stat-label">Mode</div><div class="stat-value">Admin shell</div></div>
        </div>
      </section>
    `;

    const cards = drafts.map((d, idx)=>{
      const cover = d.cover || 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=600&q=80';
      const title = escapeHtml(d.title || 'Untitled draft');
      const artist = escapeHtml(d.artist || 'Manuscript');
      const words = wordCount(d.lyrics || '');
      return `
        <div class="card" data-id="${escapeHtml(d.id || idx)}">
          <div class="card-cover-wrap"><img class="card-cover" src="${escapeHtml(cover)}" alt="${title}"></div>
          <div class="card-body">
            <div class="card-title">${title}</div>
            <div class="card-artist">${artist}</div>
            <div class="card-meta"><span>${words} words</span><span class="badge">Draft</span></div>
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = hero + '<div class="grid">' + cards + '</div>';
    content.querySelectorAll('[data-id]').forEach(card=>{
      card.addEventListener('click', ()=>{
        const id = card.dataset.id;
        const draft = drafts.find(d => String(d.id||'') === String(id));
        if(!draft) return;
        renderPublicCard(draft);
      });
    });
  }

  function renderPublicCard(draft){
    const artist = escapeHtml(draft.artist || 'Manuscript');
    const title = escapeHtml(draft.title || 'Untitled draft');
    const lyrics = buildPublicLyrics(draft);
    content.innerHTML = `
      <div class="lyrics-only-wrap">
        <div class="lyrics-only-card">
          <div class="lyrics-only-title">${title}</div>
          <div class="lyrics-only-artist">${artist}</div>
          ${lyrics}
        </div>
      </div>
    `;
  }

  function renderSide(drafts){
    sideList.innerHTML = drafts.map((d, idx)=>{
      const title = escapeHtml(d.title || 'Untitled draft');
      const artist = escapeHtml(d.artist || 'Manuscript');
      return `
        <div class="side-track" data-side-id="${escapeHtml(d.id || idx)}">
          <img class="side-cover" src="${escapeHtml(d.cover || 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=120&q=80')}" alt="${title}">
          <div>
            <div class="side-track-title">${title}</div>
            <div class="side-track-artist">${artist}</div>
          </div>
        </div>
      `;
    }).join('');

    sideList.querySelectorAll('[data-side-id]').forEach(track=>{
      track.addEventListener('click', ()=>{
        const id = track.dataset.sideId;
        const draft = drafts.find(d => String(d.id || '') === String(id));
        if(!draft) return;
        if(owner){
          renderPublicCard(draft);
        } else {
          renderPublicCard(draft);
        }
      });
    });
  }

  function render(){
    const drafts = safeGetDrafts();
    document.body.classList.toggle('public-mode', !owner);
    if(owner){
      renderSide(drafts);
      accessPill.textContent = 'Owner shell';
      buildOwnerView(drafts);
    } else {
      sideList.innerHTML = '';
      accessPill.textContent = 'Lyrics-only mode';
      if(drafts.length){
        renderPublicCard(drafts[0]);
      } else {
        content.innerHTML = '<div class="lyrics-only-wrap"><div class="lyrics-only-card"><div class="lyrics-empty">No draft lyrics are available yet.</div></div></div>';
      }
    }
  }

  render();
</script>
</body>
</html>
